<!doctype html>
<html lang="en-AU">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Earth Systems Lessons</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=JetBrains+Mono:wght@500;700&display=swap">
<style>
/* Layout: projector-first 16:9 stage under a slim lesson bar; sphere colours carry meaning everywhere */
:root{
  --bg:#e9efed; --surface:#fbfdfc; --ink:#13221e; --muted:#566862; --line:#cad7d2;
  --atmo:#2f73bb; --hydro:#0f7f80; --geo:#b0512a; --bio:#3a7f35;
  --accent:#b0512a; --accent-ink:#ffffff; --good:#2f7d3a; --bad:#b3372f;
  --f-display:"Bricolage Grotesque", "Segoe UI", system-ui, sans-serif;
  --f-body:"Atkinson Hyperlegible", "Segoe UI", system-ui, sans-serif;
  --f-mono:"JetBrains Mono", ui-monospace, Consolas, monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0d1614; --surface:#15201e; --ink:#e4eeea; --muted:#9db1aa; --line:#2b3c38;
  --atmo:#7db2ea; --hydro:#4fc4c1; --geo:#e9895a; --bio:#82c47a;
  --accent:#e9895a; --accent-ink:#1a0e08; --good:#7fcf86; --bad:#f08a80; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0d1614; --surface:#15201e; --ink:#e4eeea; --muted:#9db1aa; --line:#2b3c38;
  --atmo:#7db2ea; --hydro:#4fc4c1; --geo:#e9895a; --bio:#82c47a;
  --accent:#e9895a; --accent-ink:#1a0e08; --good:#7fcf86; --bad:#f08a80; color-scheme:dark}

html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.45}
*{box-sizing:border-box}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.app{display:flex;flex-direction:column;height:100%;padding-inline:16px}

/* top bar */
.bar{display:flex;align-items:center;gap:12px;flex-wrap:wrap;padding-block:10px}
.brand{font-family:var(--f-display);font-weight:800;font-size:18px;letter-spacing:-.01em;background:none;border:0;padding:0;display:flex;align-items:center;gap:8px}
.brand .dots{display:inline-flex;gap:3px}
.brand .dots i{width:9px;height:9px;border-radius:50%;display:block}
.lessons{display:flex;gap:6px;flex-wrap:wrap;margin-left:auto}
.lessons button{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:5px 12px;font-size:14px}
.lessons button[aria-current="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}

/* stage */
.stageWrap{flex:1;min-height:0;display:flex;align-items:center;justify-content:center}
.stage{width:min(100%, calc((100dvh - 130px) * 16 / 9));aspect-ratio:16/9;max-width:100%;container-type:inline-size;
  background:var(--surface);border:1px solid var(--line);border-radius:14px;position:relative;overflow:hidden}
.slide{position:absolute;inset:0;padding:3.2cqw 4cqw 3cqw;display:flex;flex-direction:column;gap:1.4cqw;overflow:auto;font-size:1.85cqw}
.eyebrow{display:flex;align-items:center;gap:1cqw;font-size:1.25cqw;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:700}
.mode{display:inline-flex;align-items:center;gap:.6cqw;padding:.35cqw 1cqw;border-radius:999px;background:var(--ink);color:var(--bg);letter-spacing:.06em}
.mode::before{content:"";width:.8cqw;height:.8cqw;border-radius:50%;background:var(--mc,var(--accent))}
.slide h2{font-family:var(--f-display);font-weight:800;font-size:3.5cqw;line-height:1.05;letter-spacing:-.02em;margin:0;text-wrap:balance}
.slide h3{font-family:var(--f-display);font-weight:600;font-size:2.1cqw;margin:0;line-height:1.15}
.slide p{margin:0;max-width:62ch}
.slide ul,.slide ol{margin:0;padding-left:1.4em;display:grid;gap:.5cqw}
.lead{font-size:2.3cqw;line-height:1.3}
.small{font-size:1.4cqw;color:var(--muted)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:2cqw}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:1.6cqw}
.grid4{display:grid;grid-template-columns:repeat(4,1fr);gap:1.4cqw}
.grid2>*,.grid3>*,.grid4>*{min-width:0}
.box{border:1px solid var(--line);border-radius:1cqw;padding:1.4cqw 1.6cqw;display:flex;flex-direction:column;gap:.7cqw}
.steps{counter-reset:s;list-style:none;padding:0 !important}
.steps li{counter-increment:s;display:grid;grid-template-columns:3cqw 1fr;gap:1cqw;align-items:start}
.steps li::before{content:counter(s);font-family:var(--f-display);font-weight:800;width:2.6cqw;height:2.6cqw;border-radius:50%;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;font-size:1.5cqw}
.key{font-weight:700;color:var(--accent)}
.def{border-left:.5cqw solid var(--accent);padding:.6cqw 0 .6cqw 1.4cqw;font-size:2.2cqw;line-height:1.3;max-width:56ch}
.chip{display:inline-block;padding:.2cqw .9cqw;border-radius:999px;font-weight:700;font-size:.9em}
.atmo{--sc:var(--atmo)} .hydro{--sc:var(--hydro)} .geo{--sc:var(--geo)} .bio{--sc:var(--bio)}
.tint{background:color-mix(in srgb,var(--sc) 13%,var(--surface));border-color:color-mix(in srgb,var(--sc) 45%,var(--line))}
.ink{color:var(--sc)}
.chip.atmo,.chip.hydro,.chip.geo,.chip.bio{background:var(--sc);color:var(--surface)}
.fill{flex:1;min-height:0}
.row{display:flex;gap:1cqw;flex-wrap:wrap;align-items:center}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:.8cqw;padding:.6cqw 1.3cqw;font-size:1.45cqw;font-weight:700}
.btn.primary{background:var(--ink);color:var(--bg);border-color:var(--ink)}

/* title slide */
.title{justify-content:center;gap:2cqw;background:
  radial-gradient(circle at 92% 18%, color-mix(in srgb,var(--atmo) 22%,transparent) 0 9cqw, transparent 9.1cqw),
  radial-gradient(circle at 84% 70%, color-mix(in srgb,var(--hydro) 20%,transparent) 0 11cqw, transparent 11.1cqw),
  radial-gradient(circle at 70% 32%, color-mix(in srgb,var(--bio) 18%,transparent) 0 7cqw, transparent 7.1cqw),
  radial-gradient(circle at 98% 92%, color-mix(in srgb,var(--geo) 20%,transparent) 0 8cqw, transparent 8.1cqw)}
.title .num{font-family:var(--f-mono);font-weight:700;font-size:1.5cqw;color:var(--accent);letter-spacing:.04em}
.title h1{font-family:var(--f-display);font-weight:800;font-size:6cqw;line-height:.98;letter-spacing:-.03em;margin:0;max-width:16ch;text-wrap:balance}
.lisc{display:grid;grid-template-columns:1fr 1fr;gap:2cqw;max-width:72cqw}
.lisc .box{background:var(--surface)}
.lisc h3{font-size:1.4cqw;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);font-family:var(--f-body);font-weight:700}

/* reveal cards */
.reveal{border:1px dashed var(--line);border-radius:1cqw;padding:1.2cqw 1.4cqw;background:var(--surface);text-align:left;display:flex;flex-direction:column;gap:.5cqw;min-height:7cqw}
.reveal .q{font-weight:700}
.reveal .a{display:none;color:var(--ink)}
.reveal .hint{font-size:1.2cqw;color:var(--muted)}
.reveal.open{border-style:solid;border-color:var(--accent)}
.reveal.open .a{display:block}
.reveal.open .hint{display:none}

/* tabs */
.tabbar{display:flex;gap:.6cqw;flex-wrap:wrap}
.tabbar button{border:1px solid var(--line);background:var(--surface);border-radius:.8cqw;padding:.5cqw 1.1cqw;font-size:1.45cqw;font-weight:700}
.tabbar button[aria-selected="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.panel{display:none}.panel.on{display:flex}

/* video */
.vid{aspect-ratio:16/9;width:100%;border-radius:1cqw;overflow:hidden;background:#000;border:1px solid var(--line)}
.vid iframe{width:100%;height:100%;border:0;display:block}
.vidlink{aspect-ratio:16/9;width:100%;border-radius:1cqw;border:1px solid var(--line);display:flex;flex-direction:column;justify-content:center;align-items:center;gap:1cqw;text-decoration:none;color:var(--ink);
  background:repeating-linear-gradient(135deg,color-mix(in srgb,var(--hydro) 10%,var(--surface)) 0 1.2cqw,var(--surface) 1.2cqw 2.4cqw)}
.vidlink .play{width:7cqw;height:7cqw;border-radius:50%;background:var(--bad);display:grid;place-items:center}
.vidlink .play::after{content:"";border-left:2.4cqw solid #fff;border-top:1.5cqw solid transparent;border-bottom:1.5cqw solid transparent;margin-left:.6cqw}
.vidlink b{font-family:var(--f-display);font-size:2cqw;text-align:center;padding-inline:2cqw}
.vidlink span{font-size:1.3cqw;color:var(--muted)}
.vgrid{display:grid;grid-template-columns:1.55fr 1fr;gap:2cqw;align-items:start}
.vgrid>*{min-width:0}

/* timer */
.timer{position:absolute;right:2.2cqw;bottom:2cqw;display:flex;align-items:center;gap:.6cqw;background:var(--ink);color:var(--bg);border-radius:1.2cqw;padding:.6cqw .8cqw .6cqw 1.3cqw;z-index:2}
.timer .t{font-family:var(--f-mono);font-weight:700;font-size:2.6cqw;font-variant-numeric:tabular-nums;min-width:8.5ch;text-align:center}
.timer button{background:transparent;border:1px solid color-mix(in srgb,var(--bg) 40%,transparent);color:var(--bg);border-radius:.6cqw;padding:.3cqw .8cqw;font-size:1.25cqw;font-weight:700}
.timer.done{background:var(--bad)}
.timer.done .t{animation:pulse 1s infinite}
@keyframes pulse{50%{opacity:.35}}
.hasTimer{padding-bottom:8cqw}

/* sorter */
.sortItems{display:flex;flex-wrap:wrap;gap:.7cqw;min-height:4cqw;padding:1cqw;border:1px dashed var(--line);border-radius:1cqw}
.card{border:1px solid var(--line);background:var(--surface);border-radius:.7cqw;padding:.45cqw 1cqw;font-size:1.5cqw;font-weight:700;touch-action:none;user-select:none}
.card.sel{outline:3px solid var(--accent)}
.card.ok{border-color:var(--good);box-shadow:inset 0 0 0 2px var(--good)}
.card.no{border-color:var(--bad);box-shadow:inset 0 0 0 2px var(--bad)}
.zones{display:grid;grid-template-columns:repeat(4,1fr);gap:1cqw;flex:1;min-height:0}
.zone{border:2px solid;border-radius:1cqw;padding:1cqw;display:flex;flex-direction:column;gap:.6cqw;align-content:flex-start;min-height:12cqw;text-align:left;background:color-mix(in srgb,var(--sc) 9%,var(--surface));border-color:color-mix(in srgb,var(--sc) 55%,var(--line))}
.zone h3{color:var(--sc)}
.zone .drop{display:flex;flex-wrap:wrap;gap:.5cqw}
.zone.over{background:color-mix(in srgb,var(--sc) 22%,var(--surface))}

/* big spotlight */
.spot{font-family:var(--f-display);font-weight:800;font-size:6cqw;line-height:1;letter-spacing:-.02em;text-align:center;padding:2cqw}
.corners{display:grid;grid-template-columns:1fr 1fr;gap:1cqw}
.corner{border-radius:1cqw;padding:1cqw 1.4cqw;font-weight:700;color:var(--surface);background:var(--sc);font-size:1.7cqw}
.corner.dim{opacity:.25}

/* matrix */
.matrix{display:grid;grid-template-columns:auto repeat(4,1fr);gap:.5cqw;font-size:1.4cqw}
.matrix .h{font-weight:700;padding:.5cqw;display:flex;align-items:center;justify-content:center;text-align:center;border-radius:.6cqw;color:var(--surface);background:var(--sc)}
.matrix button{border:1px solid var(--line);background:var(--surface);border-radius:.6cqw;padding:.7cqw;font-size:1.3cqw;min-height:4.4cqw}
.matrix button.seen{background:color-mix(in srgb,var(--accent) 14%,var(--surface));border-color:var(--accent)}
.matrix button.self{opacity:.55}
.mout{border:1px solid var(--accent);border-radius:1cqw;padding:1.2cqw 1.4cqw;min-height:9cqw}

/* timeline ordering */
.ordered{display:flex;flex-direction:column;gap:.5cqw;counter-reset:o;list-style:none;padding:0 !important}
.ordered li{counter-increment:o;display:flex;gap:1cqw;align-items:center;border:1px solid var(--line);border-radius:.7cqw;padding:.45cqw 1cqw;font-weight:700;font-size:1.5cqw}
.ordered li::before{content:counter(o);font-family:var(--f-mono);color:var(--muted);width:2.4cqw}
.ordered li small{font-weight:400;color:var(--muted);margin-left:auto;font-size:1.25cqw}
.ordered li.ok{border-color:var(--good);box-shadow:inset 0 0 0 2px var(--good)}
.ordered li.no{border-color:var(--bad);box-shadow:inset 0 0 0 2px var(--bad)}
.scale{display:flex;justify-content:space-between;font-family:var(--f-mono);font-size:1.15cqw;color:var(--muted);border-top:2px solid var(--muted);padding-top:.4cqw}

svg text{font-family:var(--f-body)}
.cm-edge{transition:opacity .4s}
@media (prefers-reduced-motion:reduce){.cm-edge{transition:none}.timer.done .t{animation:none}}

/* footer controls */
.ctrl{display:flex;align-items:center;gap:8px;padding-block:10px;flex-wrap:wrap}
.ctrl button{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:7px 14px;font-weight:700;font-size:14px}
.ctrl .count{font-family:var(--f-mono);font-size:14px;color:var(--muted);font-variant-numeric:tabular-nums}
.prog{flex:1;min-width:80px;height:6px;border-radius:3px;background:var(--line);overflow:hidden}
.prog i{display:block;height:100%;background:var(--accent);width:0}
.hint{font-size:12px;color:var(--muted)}

/* notes drawer */
.notes{position:fixed;right:16px;bottom:64px;width:min(420px,calc(100% - 32px));max-height:55%;overflow:auto;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px 16px;box-shadow:0 10px 30px rgba(0,0,0,.18);z-index:10;font-size:15px}
.notes h4{margin:0 0 6px;font-family:var(--f-display);font-size:16px}
.notes p{margin:0 0 6px}

/* home */
.home{position:absolute;inset:0;overflow:auto;padding:3cqw 4cqw;display:flex;flex-direction:column;gap:1.6cqw;font-size:1.7cqw}
.home h1{font-family:var(--f-display);font-weight:800;font-size:5cqw;margin:0;letter-spacing:-.03em;line-height:1}
.lcards{display:grid;grid-template-columns:repeat(4,1fr);gap:1.4cqw}
.lcard{border:1px solid var(--line);background:var(--surface);border-radius:1.2cqw;padding:1.6cqw;text-align:left;display:flex;flex-direction:column;gap:.8cqw;min-width:0}
.lcard:hover{border-color:var(--accent)}
.lcard .n{font-family:var(--f-mono);color:var(--accent);font-weight:700;font-size:1.3cqw}
.lcard b{font-family:var(--f-display);font-size:2.2cqw;line-height:1.05}
.lcard span{font-size:1.35cqw;color:var(--muted)}
.weeks{display:flex;gap:.8cqw;flex-wrap:wrap}
.weeks span{border:1px dashed var(--line);border-radius:999px;padding:.4cqw 1.2cqw;font-size:1.3cqw;color:var(--muted)}

/* narrow screens: let slides grow tall instead of shrinking type */
@media (max-width:760px){
  .stage{aspect-ratio:auto;width:100%;height:auto;min-height:60vh}
  .stageWrap{align-items:stretch}
  .slide,.home{position:relative;inset:auto;font-size:16px;padding:20px 18px}
  .slide h2{font-size:26px}.slide h3{font-size:19px}.title h1,.home h1{font-size:34px}
  .lead,.def{font-size:18px}.small,.eyebrow,.hint,.reveal .hint{font-size:13px}
  .grid2,.grid3,.grid4,.vgrid,.zones,.lisc,.lcards,.corners{grid-template-columns:1fr}
  .btn,.tabbar button,.card,.ordered li,.matrix,.matrix button,.lcard span,.lcard .n{font-size:14px}
  .lcard b{font-size:20px}.timer .t{font-size:22px}.timer button{font-size:13px}
  .timer{position:sticky;bottom:8px;align-self:flex-end}
  .spot{font-size:34px}.corner{font-size:15px}.mode::before{width:8px;height:8px}
  .steps li{grid-template-columns:28px 1fr}.steps li::before{width:24px;height:24px;font-size:13px}
  .vidlink .play{width:56px;height:56px}.vidlink b{font-size:17px}.vidlink span{font-size:13px}
  .vidlink .play::after{border-left-width:18px;border-top-width:11px;border-bottom-width:11px}
}

/* ---- additions for weeks 2 to 7 ---- */
.wkSep{width:1px;height:22px;background:var(--line);margin-inline:4px}
.lessons button.wk{font-family:var(--f-mono);font-size:13px}
.slot{cursor:pointer}
.slot rect{fill:var(--surface);stroke:var(--accent);stroke-width:2;stroke-dasharray:5 4}
.slot text{font-size:14px;font-weight:700;fill:var(--ink);font-family:var(--f-body)}
.slot.ok rect{stroke:var(--good);stroke-dasharray:none;stroke-width:3}
.slot.no rect{stroke:var(--bad);stroke-dasharray:none;stroke-width:3}
.slot:focus-visible rect{stroke-width:4}
.blank{display:inline-block;min-width:7em;border:0;border-bottom:3px dashed var(--accent);background:transparent;text-align:center;font-weight:700;padding:0 .3em;font-size:inherit}
.blank.ok{border-bottom-style:solid;border-color:var(--good)}
.blank.no{border-bottom-style:solid;border-color:var(--bad)}
.bank{display:flex;flex-wrap:wrap;gap:.6cqw}
.bank .card.used{opacity:.45}
.eqn{font-size:2.3cqw;line-height:2.2;font-family:var(--f-display)}
.ctable{border-collapse:collapse;width:100%;font-size:1.45cqw}
.ctable th,.ctable td{border:1px solid var(--line);padding:.6cqw .8cqw;text-align:left;vertical-align:top}
.ctable th{background:color-mix(in srgb,var(--ink) 6%,var(--surface))}
.ctable td.rcell{cursor:pointer;color:transparent;background:repeating-linear-gradient(135deg,color-mix(in srgb,var(--accent) 8%,var(--surface)) 0 .6cqw,var(--surface) .6cqw 1.2cqw)}
.ctable td.rcell.open{color:var(--ink);background:var(--surface)}
.tablewrap{overflow-x:auto;max-width:100%}
.die{width:9cqw;height:9cqw;border-radius:1.4cqw;background:var(--ink);color:var(--bg);display:grid;place-items:center;font-family:var(--f-mono);font-size:5cqw;font-weight:700}
.stations{display:grid;grid-template-columns:repeat(4,1fr);gap:.6cqw}
.stations button{border:1px solid var(--line);background:var(--surface);border-radius:.7cqw;padding:.6cqw;font-weight:700;font-size:1.4cqw}
.stations button[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.journey{display:flex;flex-wrap:wrap;gap:.4cqw;align-items:center;font-size:1.3cqw}
.journey span{border:1px solid var(--line);border-radius:999px;padding:.2cqw .8cqw}
.teams{display:grid;grid-template-columns:repeat(4,1fr);gap:.8cqw}
.team{border:1px solid var(--line);border-radius:1cqw;padding:.8cqw;display:flex;flex-direction:column;align-items:center;gap:.4cqw}
.team b{font-family:var(--f-mono);font-size:3cqw;font-variant-numeric:tabular-nums}
.team .row{justify-content:center}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:.8cqw}
.opts div{border:1px solid var(--line);border-radius:.8cqw;padding:.8cqw 1.1cqw}
.opts div.right{border-color:var(--good);box-shadow:inset 0 0 0 2px var(--good)}
.chartbox svg{width:100%;height:auto;display:block}
.chartbox text{font-size:12px;fill:var(--muted)}
.wkList{display:grid;grid-template-columns:1fr;gap:.7cqw}
.wkCol{display:grid;grid-template-columns:9cqw repeat(4,1fr);gap:.6cqw;align-items:stretch;min-width:0}
.wkCol>div{min-width:0}
.wkCol h3{font-family:var(--f-display);font-size:1.7cqw;margin:0}
.wkCol .lc{border:1px solid var(--line);background:var(--surface);border-radius:.8cqw;padding:.5cqw .8cqw;text-align:left;font-size:1.2cqw;display:flex;gap:.7cqw;align-items:baseline;min-width:0}
.wkCol .lc:hover{border-color:var(--accent)}
.wkCol .lc i{font-style:normal;font-family:var(--f-mono);color:var(--accent);font-weight:700;min-width:2.2em}
@media (max-width:760px){
  .eqn{font-size:18px}.ctable{font-size:13px}.die{width:64px;height:64px;font-size:34px}
  .stations,.teams,.opts{grid-template-columns:1fr 1fr}.wkCol{grid-template-columns:1fr}
  .stations button,.journey,.wkCol .lc{font-size:14px}.team b{font-size:22px}.wkCol h3{font-size:17px}
}
</style>
</head>
<body>
<div class="app">
  <header class="bar">
    <button class="brand" id="homeBtn" aria-label="Unit home"><span class="dots"><i style="background:var(--atmo)"></i><i style="background:var(--hydro)"></i><i style="background:var(--geo)"></i><i style="background:var(--bio)"></i></span>Earth Systems</button>
    <nav class="lessons" id="lessonNav" aria-label="Weeks and lessons"></nav>
  </header>
  <main class="stageWrap"><div class="stage" id="stage" aria-live="polite"></div></main>
  <footer class="ctrl" id="ctrl">
    <button id="prev" aria-label="Previous slide">&larr; Back</button>
    <button id="next" aria-label="Next slide">Next &rarr;</button>
    <span class="count" id="count"></span>
    <div class="prog" aria-hidden="true"><i id="progBar"></i></div>
    <button id="notesBtn" aria-pressed="false">Teacher notes</button>
    <button id="fsBtn">Full screen</button>
    <span class="hint">Keys: &larr; &rarr; slides, N notes, T timer</span>
  </footer>
</div>
<aside class="notes" id="notes" hidden></aside>
<script>
/* ---------- helpers ---------- */
const CAN_EMBED = location.protocol === "file:" || /(^|\.)github\.io$/.test(location.hostname) || /^(localhost|127\.)/.test(location.hostname);
const MODES = {
  learn:["Learn","var(--atmo)"], watch:["Watch","var(--bad)"], talk:["Turn and talk","var(--bio)"],
  group:["Group work","var(--hydro)"], move:["Get moving","var(--geo)"], research:["Research","var(--atmo)"],
  write:["Quick write","var(--muted)"], check:["Check in","var(--accent)"], whole:["Whole class","var(--bio)"],
  prac:["Practical","var(--hydro)"], assess:["Assessment","var(--bad)"]
};
const SPH = {atmo:"Atmosphere", hydro:"Hydrosphere", geo:"Geosphere", bio:"Biosphere"};
const LESSONS = [];
function $(s){return document.querySelector(s)}
function shuffle(a){return a.slice().sort(()=>Math.random()-.5)}

function player(id, title, source){
  if(typeof id==="object") return `<div><div class="vid"><video controls preload="metadata" playsinline src="${id.mp4}"${id.poster?` poster="${id.poster}"`:""} style="width:100%;height:100%;display:block;background:#000"></video></div><p class="small" style="margin-top:.4cqw">Video not playing? <a href="${id.page}" target="_blank" rel="noopener" style="color:inherit">Watch it on ABC Education</a></p></div>`;
  return CAN_EMBED
    ? `<div class="vid"><iframe src="https://www.youtube-nocookie.com/embed/${id}?rel=0" title="${title}" allow="accelerometer; encrypted-media; gyroscope; picture-in-picture" allowfullscreen></iframe></div>`
    : `<a class="vidlink" href="https://www.youtube.com/watch?v=${id}" target="_blank" rel="noopener"><span class="play" aria-hidden="true"></span><b>${title}</b><span>${source} &middot; opens on YouTube</span></a>`;
}
function vid(id, title, source, qs, tip){
  return `<div class="vgrid">${player(id,title,source)}<div class="box"><h3>Watch for</h3><ol>${qs.map(q=>`<li>${q}</li>`).join("")}</ol><p class="small">${title} &middot; ${source}${tip?`<br>${tip}`:""}</p></div></div>`;
}
const rv = (q,a,hint="Click to reveal") => `<button class="reveal" data-reveal><span class="q">${q}</span><span class="a">${a}</span><span class="hint">${hint}</span></button>`;
const steps = arr => `<ol class="steps">${arr.map(s=>`<li><span>${s}</span></li>`).join("")}</ol>`;
const tabs = items => `<div class="tabbar" role="tablist">${items.map((t,i)=>`<button role="tab" data-tab="${i}" aria-selected="${i===0}">${t[0]}</button>`).join("")}</div>${items.map((t,i)=>`<div class="panel box ${i===0?"on":""}" data-panel="${i}">${t[1]}</div>`).join("")}`;
const slot = (x,y,w,ans) => `<g class="slot" data-slot data-ans="${ans}" tabindex="0" role="button" aria-label="Label slot"><rect x="${x}" y="${y}" width="${w}" height="30" rx="7"/><text data-st x="${x+w/2}" y="${y+20}" text-anchor="middle">?</text></g>`;
const blank = ans => `<button class="blank" data-slot data-ans="${ans}"><span data-st>?</span></button>`;
const bankUI = `<div class="bank" id="bank"></div><div class="row"><button class="btn primary" id="slCheck">Check</button><button class="btn" id="slShow">Show answers</button><button class="btn" id="slReset">Reset</button><span class="small" id="slMsg">Click a word, then click where it goes.</span></div>`;
const sortUI = `<div class="sortItems" id="pool"></div><div class="zones" id="zones"></div><div class="row"><button class="btn primary" id="sortCheck">Check</button><button class="btn" id="sortReset">Reset</button><span class="small" id="sortMsg"></span></div>`;
const orderUI = (lo,hi) => `<div class="grid2 fill"><div style="display:flex;flex-direction:column;gap:1cqw"><div class="sortItems" id="oPool"></div><div class="row"><button class="btn primary" id="oCheck">Check</button><button class="btn" id="oShow">Show answer</button><button class="btn" id="oReset">Reset</button></div><p class="small" id="oMsg"></p></div><div style="display:flex;flex-direction:column;gap:.6cqw">${lo?`<div class="scale"><span>${lo}</span><span>${hi}</span></div>`:""}<ol class="ordered" id="oList"></ol></div></div>`;
const voteUI = (btn="Reveal answer") => `<div class="box fill" style="justify-content:center;align-items:center"><div class="spot" id="voteItem"></div><p id="voteAns" class="lead" style="text-align:center;max-width:60ch" hidden></p></div><div class="row"><button class="btn primary" id="voteReveal">${btn}</button><button class="btn" id="voteNext">Next</button><span class="small" id="voteCount"></span></div>`;

/* ---------- SVG builders ---------- */
function globeSVG(){
  return `<svg viewBox="0 0 300 300" width="88%" role="img" aria-label="Earth seen from space">
  <defs><clipPath id="gc"><circle cx="150" cy="150" r="118"/></clipPath></defs>
  <circle cx="150" cy="150" r="138" fill="none" stroke="var(--atmo)" stroke-width="10" opacity=".35"/>
  <circle cx="150" cy="150" r="118" fill="var(--hydro)"/>
  <g clip-path="url(#gc)" fill="var(--bio)"><path d="M70 90 q30 -30 70 -10 q20 20 -5 45 q-30 10 -40 40 q-30 0 -35 -30 z"/><path d="M170 150 q40 -20 70 10 q10 40 -30 70 q-30 10 -45 -20 q-15 -30 5 -60z"/><path d="M180 60 q25 -5 40 15 q-10 15 -35 5z" fill="var(--geo)"/></g>
  <g fill="#fff" opacity=".85"><ellipse cx="110" cy="200" rx="40" ry="8"/><ellipse cx="200" cy="105" rx="30" ry="6"/><ellipse cx="130" cy="70" rx="22" ry="5"/></g></svg>`;
}
function spheresVenn(note){
  const c = [["atmo",120,105],["hydro",200,105],["geo",120,185],["bio",200,185]];
  return `<svg viewBox="0 0 320 300" width="92%" role="img" aria-label="Four overlapping circles for the four spheres">
  ${c.map(s=>`<circle cx="${s[1]}" cy="${s[2]}" r="72" fill="var(--${s[0]})" fill-opacity=".18" stroke="var(--${s[0]})" stroke-width="3"/>`).join("")}
  ${c.map(s=>`<text x="${s[1]+(s[1]<160?-28:28)}" y="${s[2]+(s[2]<150?-30:42)}" text-anchor="middle" font-size="15" font-weight="700" fill="var(--${s[0]})">${SPH[s[0]]}</text>`).join("")}
  <text x="160" y="150" text-anchor="middle" font-size="12" fill="var(--ink)" font-weight="700">Earth</text><text x="160" y="164" text-anchor="middle" font-size="12" fill="var(--ink)" font-weight="700">system</text>
  ${note?`<text x="160" y="290" text-anchor="middle" font-size="12" fill="var(--muted)">${note}</text>`:""}</svg>`;
}
const CM_NODES = {sun:[60,50,"Sun","var(--accent)"],atmo:[300,60,"Atmosphere","var(--atmo)"],hydro:[520,150,"Hydrosphere","var(--hydro)"],geo:[300,330,"Geosphere","var(--geo)"],bio:[90,230,"Biosphere","var(--bio)"]};
const CM_EDGES = [["sun","atmo","heats the air, making wind"],["sun","bio","gives light for photosynthesis"],["hydro","atmo","evaporates into"],["atmo","hydro","falls back as rain"],["hydro","geo","weathers and erodes rock"],["geo","bio","provides nutrients in soil"],["bio","atmo","breathing releases CO&#8322; into"],["geo","atmo","volcanoes release gases into"]];
function cmapSVG(){
  const n=CM_NODES;
  const edges = CM_EDGES.map((e,i)=>{const a=n[e[0]],b=n[e[1]];const bend=(i%2?1:-1)*24;const mx=(a[0]+b[0])/2+bend,my=(a[1]+b[1])/2-bend;
    return `<g class="cm-edge" data-e="${i}" opacity="0"><path d="M${a[0]} ${a[1]} Q${mx} ${my} ${b[0]} ${b[1]}" fill="none" stroke="var(--muted)" stroke-width="2.5" marker-end="url(#ah)"/><circle cx="${mx}" cy="${my}" r="12" fill="var(--accent)"/><text x="${mx}" y="${my+4}" text-anchor="middle" font-size="12" font-weight="700" fill="var(--accent-ink)">${i+1}</text></g>`}).join("");
  const nodes = Object.values(n).map(v=>`<g><rect x="${v[0]-62}" y="${v[1]-20}" width="124" height="40" rx="20" fill="var(--surface)" stroke="${v[3]}" stroke-width="3"/><text x="${v[0]}" y="${v[1]+5}" text-anchor="middle" font-size="15" font-weight="700" fill="${v[3]}">${v[2]}</text></g>`).join("");
  return `<svg viewBox="0 0 600 380" width="100%" role="img" aria-label="Concept map of the Earth system"><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="var(--muted)"/></marker></defs>${edges}${nodes}</svg>`;
}
function cliffSVG(){
  return `<svg viewBox="0 0 600 300" width="100%" role="img" aria-label="Cliff that retreats as years increase">
  <rect x="0" y="0" width="600" height="300" fill="color-mix(in srgb,var(--atmo) 12%,var(--surface))"/>
  <rect x="0" y="210" width="600" height="90" fill="var(--hydro)" opacity=".75"/>
  <path id="beach" d="" fill="color-mix(in srgb,var(--geo) 35%,var(--surface))"/>
  <path id="cliff" d="" fill="var(--geo)"/><path id="grass" d="" fill="var(--bio)"/>
  <g id="house"><rect width="44" height="30" fill="var(--surface)" stroke="var(--ink)" stroke-width="2"/><path d="M-6 0 L22 -22 L50 0z" fill="var(--bad)"/></g>
  <g id="rocks" fill="var(--geo)" opacity=".8"></g>
  <path d="M0 214 q20 -6 40 0 t40 0 t40 0 t40 0 t40 0 t40 0 t40 0 t40 0 t40 0 t40 0 t40 0 t40 0 t40 0 t40 0 t40 0" fill="none" stroke="#fff" stroke-width="3" opacity=".7"/>
  <text id="houseNote" x="20" y="30" font-size="15" font-weight="700" fill="var(--bad)"></text></svg>`;
}
const ARROW = `<defs><marker id="ar" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10z" fill="var(--ink)"/></marker></defs>`;
function waterSVG(){
  return `<svg viewBox="0 0 640 360" width="100%" role="img" aria-label="Water cycle diagram with blank labels">${ARROW}
  <rect width="640" height="360" fill="color-mix(in srgb,var(--atmo) 10%,var(--surface))"/>
  <circle cx="600" cy="40" r="26" fill="var(--accent)" opacity=".85"/>
  <g fill="var(--surface)" stroke="var(--muted)" stroke-width="2"><ellipse cx="300" cy="62" rx="70" ry="26"/><ellipse cx="350" cy="52" rx="50" ry="24"/></g>
  <path d="M0 300 L0 170 L90 90 L170 170 L230 240 L330 300 Z" fill="var(--geo)" opacity=".85"/>
  <rect x="330" y="285" width="310" height="75" fill="var(--hydro)" opacity=".8"/>
  <path d="M0 300 L330 300 L330 360 L0 360 Z" fill="color-mix(in srgb,var(--geo) 45%,var(--surface))"/>
  <path d="M20 330 L300 330" stroke="var(--hydro)" stroke-width="6" stroke-dasharray="10 8" opacity=".8"/>
  <g fill="var(--bio)"><rect x="41" y="112" width="8" height="28"/><circle cx="45" cy="102" r="20"/></g>
  <g stroke="var(--hydro)" stroke-width="2"><path d="M270 95 l-8 22"/><path d="M295 95 l-8 22"/><path d="M320 95 l-8 22"/><path d="M345 92 l-8 22"/></g>
  <path d="M480 280 C480 200 430 140 400 95" fill="none" stroke="var(--ink)" stroke-width="2.5" marker-end="url(#ar)"/>
  <path d="M62 88 C110 55 180 50 232 62" fill="none" stroke="var(--ink)" stroke-width="2.5" stroke-dasharray="6 5" marker-end="url(#ar)"/>
  <path d="M150 150 C190 200 250 260 328 292" fill="none" stroke="var(--ink)" stroke-width="2.5" marker-end="url(#ar)"/>
  <path d="M80 300 L80 325" stroke="var(--ink)" stroke-width="2.5" marker-end="url(#ar)"/>
  ${slot(440,150,150,"Evaporation")}${slot(418,64,140,"Condensation")}${slot(262,128,150,"Precipitation")}${slot(52,212,120,"Runoff")}${slot(72,12,150,"Transpiration")}${slot(10,264,150,"Infiltration")}
  </svg>`;
}
function carbonSVG(){
  return `<svg viewBox="0 0 660 380" width="100%" role="img" aria-label="Carbon cycle diagram with blank labels">${ARROW}
  <rect width="660" height="380" fill="color-mix(in srgb,var(--atmo) 10%,var(--surface))"/>
  <text x="330" y="28" text-anchor="middle" font-size="16" font-weight="700" fill="var(--atmo)">CO&#8322; in the atmosphere</text>
  <rect x="0" y="250" width="420" height="130" fill="color-mix(in srgb,var(--geo) 40%,var(--surface))"/>
  <rect x="420" y="250" width="240" height="130" fill="var(--hydro)" opacity=".8"/>
  <rect x="0" y="340" width="420" height="40" fill="var(--ink)" opacity=".7"/><text x="210" y="365" text-anchor="middle" font-size="13" fill="var(--surface)" font-weight="700">Fossil fuels (coal, oil, gas)</text>
  <g fill="var(--bio)"><rect x="76" y="170" width="10" height="80"/><circle cx="81" cy="160" r="34"/></g>
  <g fill="var(--muted)"><ellipse cx="200" cy="232" rx="30" ry="15"/><rect x="180" y="242" width="6" height="10"/><rect x="214" y="242" width="6" height="10"/><circle cx="232" cy="222" r="9"/></g>
  <g fill="var(--muted)"><rect x="320" y="185" width="50" height="65"/><rect x="340" y="140" width="14" height="45"/></g>
  <circle cx="347" cy="125" r="10" fill="var(--muted)" opacity=".5"/>
  <path d="M60 60 L70 120" stroke="var(--ink)" stroke-width="2.5" marker-end="url(#ar)"/>
  <path d="M215 210 L230 70" stroke="var(--ink)" stroke-width="2.5" marker-end="url(#ar)"/>
  <path d="M130 290 C160 200 150 120 150 70" fill="none" stroke="var(--ink)" stroke-width="2.5" marker-end="url(#ar)"/>
  <path d="M347 112 L370 60" stroke="var(--ink)" stroke-width="2.5" marker-end="url(#ar)"/>
  <path d="M520 60 L520 245" stroke="var(--ink)" stroke-width="2.5" marker-end="url(#ar)"/>
  <path d="M60 300 L60 335" stroke="var(--ink)" stroke-width="2.5" marker-end="url(#ar)"/>
  ${slot(-2,80,140,"Photosynthesis")}${slot(200,120,135,"Respiration")}${slot(110,270,145,"Decomposition")}${slot(370,82,135,"Combustion")}${slot(530,140,125,"Ocean uptake")}${slot(0,300,135,"Fossilisation")}
  </svg>`;
}
function greenhouseSVG(){
  return `<svg viewBox="0 0 640 360" width="100%" role="img" aria-label="Greenhouse effect diagram with blank labels">${ARROW}
  <rect width="640" height="360" fill="color-mix(in srgb,var(--atmo) 6%,var(--surface))"/>
  <circle cx="60" cy="60" r="40" fill="var(--accent)"/>
  <rect x="0" y="150" width="640" height="60" fill="var(--atmo)" opacity=".18"/>
  <g fill="var(--atmo)">${[60,140,230,330,420,520,600].map((x,i)=>`<circle cx="${x}" cy="${170+(i%2)*18}" r="7"/>`).join("")}</g>
  <path d="M0 310 Q320 270 640 310 L640 360 L0 360 Z" fill="var(--bio)" opacity=".7"/>
  <path d="M95 85 L250 295" stroke="var(--accent)" stroke-width="4" marker-end="url(#ar)"/>
  <path d="M330 290 C340 230 360 140 380 20" fill="none" stroke="var(--bad)" stroke-width="3" stroke-dasharray="8 6" marker-end="url(#ar)"/>
  <path d="M430 290 L470 190" stroke="var(--bad)" stroke-width="3" stroke-dasharray="8 6" marker-end="url(#ar)"/>
  <path d="M500 180 L530 290" stroke="var(--bad)" stroke-width="3" marker-end="url(#ar)"/>
  ${slot(110,110,160,"Sunlight in")}${slot(250,300,170,"Infrared heat out")}${slot(20,215,170,"Greenhouse gases")}${slot(400,20,160,"Escapes to space")}${slot(470,230,160,"Sent back down")}
  </svg>`;
}
function dartSVG(){
  const board=(cx,pts,label)=>`<g><circle cx="${cx}" cy="80" r="60" fill="var(--surface)" stroke="var(--line)" stroke-width="2"/><circle cx="${cx}" cy="80" r="38" fill="none" stroke="var(--line)" stroke-width="2"/><circle cx="${cx}" cy="80" r="14" fill="var(--accent)" opacity=".3"/>${pts.map(p=>`<circle cx="${cx+p[0]}" cy="${80+p[1]}" r="5" fill="var(--ink)"/>`).join("")}<text x="${cx}" y="162" text-anchor="middle" font-size="13" font-weight="700" fill="var(--ink)">${label}</text></g>`;
  return `<svg viewBox="0 0 600 175" width="100%" role="img" aria-label="Four dartboards showing accuracy and precision">
  ${board(75,[[-3,2],[4,-3],[1,5],[-4,-4]],"A")}${board(225,[[30,-28],[36,-24],[33,-33],[27,-30]],"B")}${board(375,[[-40,10],[25,35],[10,-45],[-20,-30]],"C")}${board(525,[[-35,30],[40,-10],[-5,-48],[30,40]],"D")}</svg>`;
}
function lineChart(series, o){
  const W=600,H=o.h||230,P={l:48,r:16,t:16,b:30};
  const xs=series.flatMap(s=>s.pts.map(p=>p[0])), ys=series.flatMap(s=>s.pts.map(p=>p[1]));
  const x0=o.xmin??Math.min(...xs), x1=o.xmax??Math.max(...xs), y0=o.ymin??Math.min(...ys), y1=o.ymax??Math.max(...ys);
  const X=v=>P.l+(v-x0)/(x1-x0)*(W-P.l-P.r), Y=v=>H-P.b-(v-y0)/(y1-y0)*(H-P.t-P.b);
  const yt=o.yticks, xt=o.xticks;
  let g=yt.map(v=>`<line x1="${P.l}" x2="${W-P.r}" y1="${Y(v)}" y2="${Y(v)}" stroke="var(--line)"/><text x="${P.l-6}" y="${Y(v)+4}" text-anchor="end">${v}</text>`).join("");
  g+=xt.map(v=>`<text x="${X(v)}" y="${H-10}" text-anchor="middle">${v}</text>`).join("");
  if(o.zero!==undefined)g+=`<line x1="${P.l}" x2="${W-P.r}" y1="${Y(o.zero)}" y2="${Y(o.zero)}" stroke="var(--muted)" stroke-dasharray="4 4"/>`;
  const lines=series.map(s=>{
    const d=s.pts.map((p,i)=>`${i?"L":"M"}${X(p[0]).toFixed(1)} ${Y(p[1]).toFixed(1)}`).join(" ");
    const last=s.pts[s.pts.length-1];
    return `<g class="${s.cls||""}" ${s.hidden?'opacity="0"':""}>${s.line===false?"":`<path d="${d}" fill="none" stroke="${s.color}" stroke-width="${s.w||2.5}" ${s.dash?`stroke-dasharray="${s.dash}"`:""}/>`}
      ${s.dots?s.pts.map(p=>`<circle cx="${X(p[0])}" cy="${Y(p[1])}" r="${s.r||4}" fill="${p[2]||s.color}"/>`).join(""):`<circle cx="${X(last[0])}" cy="${Y(last[1])}" r="5" fill="${s.color}"/>`}</g>`}).join("");
  return `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="${o.label}">${g}${lines}<text x="${P.l}" y="11" font-weight="700" style="fill:var(--ink)">${o.ylabel}</text></svg>`;
}

/* ---------- interactives (data-driven; each receives the slide) ---------- */
const INIT = {
  vote(s){
    const items=s.data; let i=0; const it=$("#voteItem"),an=$("#voteAns"),ct=$("#voteCount"),rb=$("#voteReveal");
    const show=()=>{it.innerHTML=items[i][0];an.innerHTML=items[i][1]||"";an.hidden=true;rb.hidden=!items[i][1];ct.textContent=`${i+1} of ${items.length}`};
    rb.onclick=()=>an.hidden=false; $("#voteNext").onclick=()=>{i=(i+1)%items.length;show()}; show();
  },
  cmap(){
    let k=0; const g=[...document.querySelectorAll(".cm-edge")],lab=$("#cmLabel"),cnt=$("#cmCount");
    const upd=()=>{g.forEach((e,i)=>e.setAttribute("opacity",i<k?1:0));cnt.textContent=`${k} of ${g.length} links`;
      if(k){const e=CM_EDGES[k-1];lab.innerHTML=`<p class="small">Link ${k}</p><p class="lead"><b style="color:${CM_NODES[e[0]][3]}">${CM_NODES[e[0]][2]}</b> ${e[2]} <b style="color:${CM_NODES[e[1]][3]}">${CM_NODES[e[1]][2]}</b></p>`}else lab.innerHTML=`<p class="small">Click "Next link" to start.</p>`};
    $("#cmNext").onclick=()=>{if(k<g.length)k++;upd()}; $("#cmAll").onclick=()=>{k=g.length;upd()}; $("#cmReset").onclick=()=>{k=0;upd()}; upd();
  },
  sort(s){
    const {zones,items,note}=s.data; const pool=$("#pool"),zb=$("#zones"); let sel=null;
    zb.style.gridTemplateColumns=`repeat(${zones.length},1fr)`;
    zb.innerHTML=zones.map(z=>`<div class="zone ${z[2]||""}" data-zone="${z[0]}" tabindex="0" ${z[2]?"":'style="--sc:var(--muted)"'}><h3>${z[1]}</h3><div class="drop"></div></div>`).join("");
    const mk=([t,a])=>{const c=document.createElement("button");c.className="card";c.innerHTML=t;c.dataset.ans=a;c.draggable=true;
      c.onclick=e=>{e.stopPropagation();if(sel)sel.classList.remove("sel");sel=(sel===c?null:c);if(sel)sel.classList.add("sel")};
      c.ondragstart=e=>{sel=c;e.dataTransfer.setData("text/plain","x")};return c};
    const reset=()=>{pool.innerHTML="";zb.querySelectorAll(".drop").forEach(d=>d.innerHTML="");shuffle(items).forEach(x=>pool.appendChild(mk(x)));$("#sortMsg").textContent=""};
    const place=z=>{if(!sel)return;z.querySelector(".drop").appendChild(sel);sel.classList.remove("sel","ok","no");sel=null};
    zb.querySelectorAll(".zone").forEach(z=>{z.onclick=()=>place(z);z.onkeydown=e=>{if(e.key==="Enter")place(z)};
      z.ondragover=e=>{e.preventDefault();z.classList.add("over")};z.ondragleave=()=>z.classList.remove("over");z.ondrop=e=>{e.preventDefault();z.classList.remove("over");place(z)}});
    pool.onclick=()=>{if(sel){pool.appendChild(sel);sel.classList.remove("sel");sel=null}};
    $("#sortCheck").onclick=()=>{let ok=0,tot=0;zb.querySelectorAll(".zone").forEach(z=>z.querySelectorAll(".card").forEach(c=>{tot++;const g=c.dataset.ans.split(" ").includes(z.dataset.zone);c.classList.toggle("ok",g);c.classList.toggle("no",!g);if(g)ok++}));

  corners(s){

  matrix(s){

{ n:1, title:"What is an Earth system?",

  {mode:"talk", timer:3, h:"What makes Earth able to support life?",

   notes:"Silent think time first, then 2 minutes in pairs. Cold call 4 to 6 pairs. Collect ideas on the board grouped loosely by sphere (don't name the spheres yet)."},
  {mode:"whole", h:"Our list: what makes Earth livable",
   html:`<p>Click each card after a pair has suggested something close to it.</p><div class="grid3">${[
     ["Liquid water","Oceans, rivers, groundwater and rain. Every living cell needs it."],
     ["Air to breathe","About 21% oxygen. Plants also need carbon dioxide."],
     ["Energy from the Sun","Light and heat drive weather and photosynthesis."],
     ["Soil and nutrients","Weathered rock plus dead organisms make soil for plants."],
     ["A livable temperature","Greenhouse gases keep Earth about 33&deg;C warmer than it would be without them."],
     ["Protection","The ozone layer blocks most UV. The magnetic field deflects solar wind."]

   notes:"Reveal cards only when the class gets near the idea. The 33 degrees figure returns in Week 6."},
  {mode:"learn", h:"So what is a system?",
   html:`<p class="def">A <b>system</b> is a group of parts that <b>interact</b> and work together. A change in one part causes changes in other parts.</p>
   <div class="grid3"><div class="box"><h3>Parts</h3><p>The pieces that make up the system. In a bike: wheels, chain, pedals, rider.</p></div><div class="box"><h3>Interactions</h3><p>How the parts affect each other. Pushing the pedal moves the chain, which turns the wheel.</p></div><div class="box"><h3>Inputs and outputs</h3><p>What goes in and comes out. A bike takes in the rider's energy and gives out movement and heat.</p></div></div>`,
   notes:"Students copy only the definition. Ask: what happens to the whole system if the chain breaks?"},
  {mode:"whole", h:"System or not?", init:"vote",
   data:[["A bicycle","System. Its parts (pedals, chain, wheels) interact to make it move."],["A single rock","Not really a system. It is a part of the geosphere system, but its pieces don't interact to do anything."],["The human body","System. Organs interact, e.g. lungs and heart deliver oxygen."],["A pile of sand","Debatable. Grains sit together but barely interact. Most scientists would call it part of a system, like a beach."],["A rainforest","System. Plants, animals, soil, water and air all interact."],["Our school","System. Students, teachers, timetables and buildings interact. Change one bell time and everything shifts!"]],
   html:`<p>Thumbs up if it is a system, thumbs down if it is not, flat hand if you are unsure. Then we reveal and justify.</p>${voteUI()}`,
   notes:"Ask a 'down' student and an 'up' student to argue each time before revealing."},
  {mode:"learn", h:"Earth is a system of systems",
   html:`<div class="grid2 fill"><div style="display:grid;place-items:center">${spheresVenn()}</div><div style="display:flex;flex-direction:column;gap:1.2cqw"><p class="lead">Scientists split Earth into four main parts called <b>spheres</b>. Each sphere is a system on its own, and they are all connected.</p>

  {mode:"watch", h:"Earth: A System of Systems",

  {mode:"whole", h:"Building the Earth system concept map", init:"cmap",

   html:`<div class="grid4 fill">${[
     ["atmo","All the gases around Earth.","Air, wind, ozone layer","About 78% nitrogen, 21% oxygen and only about 0.04% carbon dioxide."],
     ["hydro","All of Earth's water: liquid, ice and vapour.","Oceans, rivers, groundwater, glaciers, rain","About 97% of Earth's water is salty ocean. Most fresh water is frozen."],
     ["geo","All the solid (and molten) rock of Earth.","Crust, mantle, core, mountains, sand","From the surface to the centre is about 6,370 km."],
     ["bio","All living things and where they live.","Plants, animals, fungi, bacteria, you","Life is found from deep ocean vents to high in the air."]
   ].map(s=>`<div class="box tint ${s[0]}"><h3 class="ink">${SPH[s[0]]}</h3><p><b>${s[1]}</b></p><p class="small">Includes: ${s[2]}</p><p style="font-size:1.45cqw">${s[3]}</p></div>`).join("")}</div>`,
   notes:"Students don't copy this now; it goes into their quadrant organiser later. The tiny CO2 figure returns in Week 6."},
  {mode:"whole", h:"Sort it: which sphere?", init:"sort",
   data:{zones:[["atmo","Atmosphere","atmo"],["hydro","Hydrosphere","hydro"],["geo","Geosphere","geo"],["bio","Biosphere","bio"]],
     items:[["Clouds","hydro atmo"],["Wind","atmo"],["Ozone layer","atmo"],["The River Murray","hydro"],["Groundwater","hydro"],["A glacier","hydro"],["Basalt rock","geo"],["Flinders Ranges","geo"],["Sand dunes","geo"],["Magma","geo"],["Magpie","bio"],["River red gum","bio"],["Mushrooms","bio"],["Coral reef","bio geo"],["Bacteria","bio"],["Rain","hydro"]],
     note:"Clouds and coral reef fit two spheres."},
   html:`<p class="small">Click a card, then click a sphere (or drag it). Students come up one at a time. Press Check when the class agrees.</p>${sortUI}`,
   notes:"Pick students using names from a cup. The check accepts any correct sphere for items that fit two."},
  {mode:"move", h:"Four Corners", init:"corners",
   data:[["A kookaburra",["bio"]],["Hail",["hydro","atmo"]],["Uluru",["geo"]],["The ozone layer",["atmo"]],["A fish in the Murray",["bio","hydro"]],["Volcanic ash cloud",["geo","atmo"]],["Snow on a mountain",["hydro","geo"]],["Fog over the hills",["hydro","atmo"]],["A worm in soil",["bio","geo"]],["Sea spray",["hydro","atmo"]],["Oxygen",["atmo"]],["An opal",["geo"]],["Kelp forest",["bio","hydro"]],["Lava",["geo"]]],
   html:`<div class="grid2 fill" style="grid-template-columns:1fr 1.2fr"><div class="box"><h3>How it works</h3>${steps(["Each corner of the room is a sphere.","Read the item. Walk to the corner you think it belongs in.","If it belongs to two spheres, stand <b>between</b> the corners.","Be ready to defend your spot."])}<div class="corners" id="cornerKey">${Object.keys(SPH).map(k=>`<div class="corner ${k}" data-c="${k}">${SPH[k]}</div>`).join("")}</div></div>
   <div class="box" style="justify-content:space-between"><div class="spot" id="cItem">Ready?</div><p id="cWhy" class="lead" style="text-align:center" hidden></p><div class="row" style="justify-content:center"><button class="btn primary" id="cNext">Next item</button><button class="btn" id="cShow">Show answer</button></div></div></div>`,
   notes:"When students stand between corners, ask them to name the interaction (e.g. a fish: biosphere living in the hydrosphere)."},
  {mode:"talk", timer:4, h:"Tricky ones: where do these belong?",
   html:`<p>Turn and talk. For each item, decide <b>which spheres</b> and <b>why</b>. Then click to compare.</p><div class="grid4">${[
     ["Soil","All four! Rock minerals (geo), water in gaps (hydro), air in pores (atmo), worms, roots and microbes (bio)."],
     ["A cloud","Hydrosphere (water droplets) floating in the atmosphere."],
     ["A coral reef","Biosphere (living coral) that builds rock-like limestone (geosphere), in the hydrosphere."],
     ["You","Biosphere. But you are about 60% water and you breathe the atmosphere. You are an interaction."]
   ].map(c=>rv(c[0],c[1],"Decide first, then click")).join("")}</div><p class="small">Big idea: the boundaries between spheres are fuzzy because they <b>interact</b>. That's next lesson.</p>`,
   notes:"Real things often sit at the meeting point of spheres. That is why we study interactions in Lesson 3."},
  {mode:"write", timer:10, h:"Four-quadrant organiser",
   html:`<div class="grid2 fill"><div class="box"><p>Fold a page into four (or use the handout). One sphere per quadrant. In each quadrant:</p>${steps(["A <b>definition</b> in your own words.","<b>Three examples</b>, including one from South Australia.","A small <b>sketch</b> or symbol.","One <b>link</b> to another sphere."])}</div>
   <div class="grid2"><div class="box tint atmo"><h3 class="ink">Atmosphere</h3></div><div class="box tint hydro"><h3 class="ink">Hydrosphere</h3></div><div class="box tint geo"><h3 class="ink">Geosphere</h3></div><div class="box tint bio"><h3 class="ink">Biosphere</h3></div></div></div>`,
   notes:"Formative evidence for Lesson 2. SA examples: Gulf St Vincent, the Murray, the Flinders Ranges, seagrass meadows, mallee scrub."},
  {mode:"check", h:"Exit: hinge question",
   html:`<p class="lead">Hold up 1, 2, 3 or 4 fingers.</p><div class="box"><p><b>Groundwater stored in cracks in rock deep underground belongs to the...</b></p><ol><li>Geosphere only</li><li>Hydrosphere only</li><li>Atmosphere</li><li>Hydrosphere, stored in the geosphere</li></ol></div>${rv("Answer","4. The water is part of the hydrosphere, but it is held inside the geosphere.")}`,
   notes:"Answers 1 and 2 show partial understanding. If many choose them, spend 2 minutes on 'water in rock is still water'."}
  ]},

{ n:3, title:"Interactions between the spheres",
  li:"Explain how Earth's spheres interact.",
  sc:["I can give examples of interactions between spheres.","I can explain an interaction using cause and effect."],
  prep:"Print the 4 expert cards (slide 5) one set per expert table. Interaction diagram handout or blank paper. Sticky notes.",
  slides:[
  {mode:"talk", timer:3, h:"Odd one out",
   html:`<div class="grid4">${["Rain","A river","A cloud","A cliff"].map((w,i)=>`<div class="box tint ${["atmo","hydro","atmo","geo"][i]}" style="align-items:center;justify-content:center;min-height:12cqw"><span class="spot" style="font-size:3.4cqw;padding:0">${w}</span></div>`).join("")}</div>
   <p class="lead">Which is the odd one out, and why? There is more than one right answer.</p>${rv("Some answers","The cliff: the only solid. The cloud: the only one in the sky. Or... they are all connected: rain falls from clouds, fills rivers, and wears away cliffs.")}`,
   notes:"Steer toward the last answer: they are connected, which is today's focus."},
  {mode:"learn", h:"What is an interaction?",
   html:`<p class="def">An <b>interaction</b> happens when matter or energy moves from one sphere to another, or when one sphere causes a change in another.</p>
   <div class="grid2"><div class="box"><h3>We write it with an arrow</h3><p style="font-size:2.4cqw;font-family:var(--f-display)"><span class="hydro ink">Hydrosphere</span> &rarr; <span class="geo ink">Geosphere</span></p><p>The arrow points from the <b>cause</b> to the <b>effect</b>.</p></div>
   <div class="box"><h3>Worked example: rain weathering rock</h3><p><b>Cause:</b> rain (hydrosphere) falls on rock and flows into cracks.</p><p><b>Effect:</b> the rock (geosphere) slowly breaks down and is carried away as sediment.</p><p class="small">The sediment helps make soil, so the biosphere is involved too. One interaction often leads to another.</p></div></div>`,
   notes:"Model the cause-effect language explicitly. Students use the arrow notation in the jigsaw and exit ticket."},
  {mode:"watch", h:"The Four Spheres: interactions that shape the world",
   html:vid("gWHE4ug1xpc","The Four Spheres: Interactions that Shape the World","Equatoro",["Write down every interaction you hear, as 'sphere &rarr; sphere'.","Which example involved three or more spheres?","Why does the video say the spheres are hard to separate?"]),
   notes:"Pause halfway and have pairs compare arrows."},
  {mode:"group", h:"Jigsaw: become the expert",
   html:`<div class="grid2 fill"><div class="box"><h3>Expert groups (12 minutes)</h3>${steps(["Number off 1 to 4 in your home group.","Move to the expert table with your number.","Read your card on the next slide together.","Agree on how you will explain it in <b>under 1 minute</b>, with a sketch."])}</div>
   <div class="box"><h3>Home groups (8 minutes)</h3>${steps(["Return to your home group.","Each expert teaches their interaction. 1 minute each.","Together, annotate the interaction diagram with all four examples."])}<p class="small">Roles in expert groups: reader, sketcher, checker, timekeeper.</p></div></div>`,
   notes:"Groups of 4 (doubles share a card if needed)."},
  {mode:"group", timer:12, h:"Expert cards",
   html:tabs([
     ["1. Rain and rock", `<h3><span class="hydro ink">Hydrosphere</span> &rarr; <span class="geo ink">Geosphere</span></h3><p>Rainwater is slightly acidic because it dissolves a little carbon dioxide from the air. Over many years it dissolves and breaks down rock, especially limestone. Water also freezes and expands in cracks, splitting rock apart. Rivers carry the broken pieces (sediment) away.</p><p><b>Questions:</b> Which spheres are involved? Is this fast or slow? Where could sediment end up?</p>`],
     ["2. Plants take in water and CO&#8322;", `<h3><span class="hydro ink">Hydrosphere</span> + <span class="atmo ink">Atmosphere</span> &rarr; <span class="bio ink">Biosphere</span></h3><p>Plant roots draw water from the soil. Leaves take in carbon dioxide from the air through tiny pores called stomata. Using sunlight, plants turn these into sugar and release oxygen. Water also evaporates from leaves back into the air.</p><p><b>Questions:</b> Which way does matter move? What goes back to the atmosphere? Why does this matter for animals?</p>`],
     ["3. Volcanoes release gases", `<h3><span class="geo ink">Geosphere</span> &rarr; <span class="atmo ink">Atmosphere</span></h3><p>Magma contains dissolved gases: water vapour, carbon dioxide and sulfur dioxide. In an eruption these escape into the air. Ash can block sunlight and cool the climate for a short time. Volcanic rock weathers into rich soil. Mount Gambier in SA is a volcano that last erupted about 5,000 years ago.</p><p><b>Questions:</b> Which spheres are affected? Can a volcano be good for the biosphere?</p>`],
     ["4. Ocean and air swap", `<h3><span class="hydro ink">Hydrosphere</span> &harr; <span class="atmo ink">Atmosphere</span></h3><p>Water evaporates from the ocean into the air, then falls as rain. The ocean also absorbs carbon dioxide from the air, and releases some back. Warm ocean water heats the air above it, which drives wind and storms. Wind, in turn, makes waves and currents.</p><p><b>Questions:</b> Why is this arrow two-way? What would happen to the air if the ocean stopped absorbing CO&#8322;?</p>`]
   ]),
   notes:"Card 4 sets up ocean uptake (Week 3). Card 2 sets up photosynthesis (Week 4)."},
  {mode:"group", timer:8, h:"Home groups: teach and annotate",
   html:`<div class="grid2 fill"><div class="box">${steps(["Each expert teaches for 1 minute. Others ask one question.","On the interaction diagram, draw an arrow for each example.","Label every arrow with the process (e.g. 'weathering').","Circle any example that involves three or more spheres."])}</div><div style="display:grid;place-items:center">${spheresVenn("Draw and label an arrow for each expert example")}</div></div>`,
   notes:"Evidence for Lesson 3: the annotated interaction diagram."},
  {mode:"whole", h:"Interaction matrix challenge", init:"matrix",
   data:{"atmo-atmo":"Warm air rises and cool air sinks, making wind.","atmo-hydro":"Rain and snow fall into rivers and oceans. Wind makes waves.","atmo-geo":"Wind blows sand into dunes. Frost cracks rock.","atmo-bio":"Plants take in CO&#8322;; animals breathe in oxygen. Storms damage forests.",
      "hydro-atmo":"Evaporation adds water vapour to the air. Warm oceans heat the air, fuelling storms.","hydro-hydro":"Rivers flow into the ocean; currents move water around the globe.","hydro-geo":"Rain and waves weather and erode rock and cliffs.","hydro-bio":"Every living thing needs water. Floods trigger breeding events.",
      "geo-atmo":"Volcanoes release gases and ash. Mountains force air up, making rain.","geo-hydro":"Rock and soil store groundwater. Mountains shape where rivers flow.","geo-geo":"Tectonic plates push rock up into mountains.","geo-bio":"Soil provides nutrients. Caves and cliffs provide shelter.",
      "bio-atmo":"Plants release oxygen. Animals and decomposers release CO&#8322;. Cows release methane.","bio-hydro":"Leaves release water vapour (transpiration). Roots slow water flow.","bio-geo":"Roots split rocks. Worms mix soil. Coral builds limestone reefs.","bio-bio":"Predators eat prey; bees pollinate flowers."},
   html:`<div class="grid2 fill" style="grid-template-columns:1.3fr 1fr"><div><p class="small">Read across: the row sphere <b>affects</b> the column sphere. Groups suggest an example first, then click to see ours.</p><div class="matrix" id="matrix"></div></div><div class="mout" id="mout"><p class="small">Pick a cell. Can your group beat our example?</p></div></div>`,
   notes:"Points game: 1 point per group with a valid example before you click."},
  {mode:"talk", timer:6, h:"How are these spheres connected? (SA edition)",
   html:`<p>With your partner, choose <b>two</b> scenarios. For each: name the spheres, draw the arrow, and explain cause and effect.</p><div class="grid3">${[
     ["Waves at Port Willunga","Waves keep hitting the soft cliffs along the beach."],
     ["Dust storm over Adelaide","Dry, strong winds pick up topsoil from farms after a drought."],
     ["Koala in a river red gum","Eats leaves, gets most of its water from them, rests in the branches."],
     ["Murray River flood, 2022 to 23","The biggest flood since 1956 spreads water and silt across the floodplain."],
     ["Seagrass in Gulf St Vincent","Meadows trap sand and take in CO&#8322; from seawater."],
     ["A cow burping in the paddock","Microbes in its gut make methane, which goes into the air."]
   ].map(s=>`<div class="box"><h3>${s[0]}</h3><p class="small" style="color:var(--ink)">${s[1]}</p></div>`).join("")}</div>`,
   notes:"Local contexts set up Lesson 24. Seagrass is 'blue carbon' and returns later. Early finishers find a chain of three spheres."},
  {mode:"write", h:"Exit ticket: the interaction chain",
   html:`<div class="grid2 fill"><div class="box" style="justify-content:center"><p class="lead">Complete on a sticky note, then stick it on the door as you leave:</p><p class="def">"The ___ (sphere) affects the ___ (sphere) because ___. This then ___."</p></div>
   <div class="box"><h3>Fist to five</h3><ul><li>I can give examples of interactions between spheres.</li><li>I can explain an interaction using cause and effect.</li></ul></div></div>`,
   notes:"The 'This then' part shows whether students can extend to a second interaction."}
  ]},

{ n:4, title:"Earth is dynamic",
  li:"Understand that Earth's systems are always changing.",
  sc:["I can explain that Earth systems change over time due to natural processes.","I can compare fast and slow changes and name the spheres involved."],
  prep:"Print the six station cards (slide 6), sticky notes in a different colour per group. Laptops for Earth Timelapse.",
  slides:[
  {mode:"whole", h:"Same coast, different century", init:"cliff",
   html:`<div class="grid2 fill" style="grid-template-columns:1.6fr 1fr"><div style="display:flex;flex-direction:column;gap:1cqw">${cliffSVG()}<label class="row small" for="yrs"><b>Years from now</b> <input type="range" id="yrs" min="0" max="2000" step="50" value="0" style="flex:1;min-width:120px"> <span id="yrsOut" style="font-family:var(--f-mono)">0</span></label></div>
   <div class="box"><h3>Predict, then slide</h3><p>Soft coastal cliffs like those at Port Willunga are worn back by waves, wind and rain.</p><ol><li>Before sliding: what will change? What will stay?</li><li>Which spheres cause the change?</li><li>Would you build a house on the cliff top?</li></ol><p class="small">Illustration only. Not to scale, and real rates vary a lot from place to place.</p></div></div>`,
   notes:"Get predictions first. Things that look permanent are changing, just slowly."},
  {mode:"learn", h:"What does dynamic mean?",
   html:`<p class="def">A <b>dynamic</b> system is always changing. Earth's spheres are constantly moving matter and energy between each other, so Earth never stays exactly the same.</p>
   <div class="grid3"><div class="box"><h3>Fast changes</h3><p>Seconds to days: lightning, storms, floods, bushfires, eruptions.</p></div><div class="box"><h3>Slow changes</h3><p>Years to millions of years: erosion, soil forming, mountains rising.</p></div><div class="box"><h3>Cycles</h3><p>Changes that repeat: day and night, seasons, tides.</p></div></div>
   <p class="small">Even when Earth looks stable, it is balancing many changes at once. Scientists call this a <b>dynamic equilibrium</b>.</p>`,
   notes:"Dynamic equilibrium sets up 'system balance' language for human impacts later."},
  {mode:"group", h:"Fastest to slowest", init:"order",
   data:[["Lightning strike","under a second"],["A bushfire front passes","minutes to hours"],["A flash flood","hours"],["Seasons change","months"],["A gum tree grows to full size","decades"],["Coastal cliff retreats a few metres","decades to centuries"],["A cave forms in limestone","thousands of years"],["A mountain range rises","millions of years"]],
   html:`<p class="small">Groups agree on an order first. Then a volunteer clicks the events from <b>fastest</b> to <b>slowest</b>.</p>${orderUI("fastest","slowest")}`,
   notes:"Groups of 3 to 4 with paper cards first (2 minutes), then do it on the board."},
  {mode:"move", h:"Gallery walk: six SA stations",
   html:`<div class="grid2 fill"><div class="box">${steps(["Groups of 4 or 5. Start at your numbered station.","<b>3 minutes</b> per station. Move when the timer ends.","On sticky notes: <b>What changes? Which spheres? Fast or slow?</b>","Read earlier groups' notes. Tick if you agree, add if you don't."])}</div>
   <div class="box"><h3>Stations</h3><ol><li>Weather: the 2016 storm</li><li>Erosion: coastal cliffs</li><li>Living things: seagrass</li><li>Seasons: the Murray</li><li>Volcanoes: Mount Gambier</li><li>Fire: Kangaroo Island</li></ol></div></div>`,
   notes:"Use the timer on the next slide for each rotation. 6 stations x 3 min = 18 min."},
  {mode:"move", timer:3, h:"Station cards",
   html:tabs([
     ["1. Weather","<h3>The 2016 SA storm</h3><p>In September 2016 a severe storm with tornadoes crossed South Australia. It knocked over electricity transmission towers and the whole state lost power. Heavy rain caused flooding in some areas.</p><p class='small'>Spheres? How long did the change take? What lasted afterwards?</p>"],
     ["2. Erosion","<h3>Coastal cliffs</h3><p>Along the Fleurieu coast, waves, wind and rain wear back soft cliffs. Rock falls happen suddenly, but they come from years of slow weathering. Some beach stairs and paths have had to be closed or moved.</p><p class='small'>Spheres? Is this fast, slow, or both?</p>"],
     ["3. Living things","<h3>Seagrass meadows</h3><p>Seagrass along the Adelaide coast holds sand in place and shelters fish. Since the 1940s, thousands of hectares have been lost, partly from stormwater and wastewater. Where seagrass dies, sand moves more easily.</p><p class='small'>Spheres? How can living things change the geosphere?</p>"],
     ["4. Seasons","<h3>The Murray through the year</h3><p>River flow changes with the seasons and with rain far upstream. In 2022 to 23 the Murray had its biggest flood since 1956, spreading water and silt across the floodplain and triggering huge bird breeding events.</p><p class='small'>Spheres? Is a flood a 'bad' change for the biosphere?</p>"],
     ["5. Volcanoes","<h3>Mount Gambier</h3><p>Mount Gambier and nearby Mount Schank are young volcanoes that last erupted about 5,000 years ago. The Blue Lake fills a volcanic crater with groundwater, and the volcanic soils are very fertile.</p><p class='small'>Spheres? How can a volcano change things long after it erupts?</p>"],
     ["6. Fire","<h3>Kangaroo Island, 2019 to 20</h3><p>Bushfires burned around half of Kangaroo Island. Smoke and carbon dioxide went into the air and many animals died. Within months, many eucalypts were sprouting new shoots from their trunks.</p><p class='small'>Spheres? Is fire only destructive? How fast did recovery start?</p>"]
   ]),
   notes:"Facts are kept general so students can check them. Extension: find one more SA example at home."},
  {mode:"talk", timer:3, h:"Debrief: which change surprised you?",
   html:`<div class="grid2 fill"><div class="box" style="justify-content:center"><p class="lead">Turn and talk:</p><ul><li>Which station showed the <b>fastest</b> change? The <b>slowest</b>?</li><li>Which station involved <b>all four</b> spheres?</li><li>Which changes involved <b>humans</b> as well as nature?</li></ul></div>
   <div class="box"><h3>Class consensus</h3><p>Hands up for each station: <b>Fast</b>, <b>Slow</b> or <b>Both</b>?</p><p class="small">Most are "both": a sudden event that comes from, or leads to, slow change.</p></div></div>`,
   notes:"Seagrass loss and the fire story involve human activity; this foreshadows Week 5."},
  {mode:"research", timer:10, h:"Earth Timelapse: see Earth change from space",
   html:`<div class="grid2 fill"><div class="box">${steps(["In pairs, open <a href='https://earthengine.google.com/timelapse/' target='_blank' rel='noopener'>Google Earth Timelapse</a>.","Search a place from the list, or choose your own.","Watch from 1984 to now. Find <b>three changes</b>.","For each: which spheres, and is it natural, human, or both?"])}</div>
   <div class="box"><h3>Places to try</h3><ul><li>Aral Sea (Kazakhstan)</li><li>Columbia Glacier (Alaska)</li><li>Adelaide's northern suburbs</li><li>Lake Eyre (Kati Thanda)</li><li>Dubai coastline</li></ul></div></div>`,
   notes:"If devices are unavailable, project it and run it as a whole class."},
  {mode:"watch", h:"Pulling it together: Earth system science",
   html:vid("ktzzIz6SYFU","Launchpad: Systems Science","NASA eClips",["How many spheres does NASA describe? Which one is extra?","Name one change in the Earth system that NASA tracks.","How does studying the spheres together help scientists?"]),
   notes:"Optional if time is short. Introduces the cryosphere."},
  {mode:"write", h:"Exit ticket: why is Earth called a dynamic system?",
   html:`<div class="grid2 fill"><div class="box"><p class="lead">Answer in 2 to 3 sentences.</p><h3>Sentence starters</h3><ul><li>Earth is dynamic because...</li><li>For example, ___ (sphere) changes ___ (sphere) when...</li><li>Some changes are fast, like ___, while others are slow, like ___.</li></ul></div>
   <div class="box"><h3>Word bank</h3><p>system &middot; interact &middot; sphere &middot; matter &middot; energy &middot; erosion &middot; weathering &middot; fast &middot; slow &middot; cycle</p><h3 style="margin-top:1cqw">Week 1 traffic light</h3><p>Circle on your ticket: <b class="bio ink">green</b> got it, <b style="color:var(--geo)">orange</b> mostly, <b style="color:var(--bad)">red</b> need help.</p></div></div>`,
   notes:"Collect exit tickets. Use the traffic lights to plan the Week 2 starter."}
  ]}
);

const WATER_DICE={
  "Ocean":[["Cloud","Sun heats the sea surface. You evaporate."],["Cloud","Wind and warmth: evaporation."],["Ocean","You stay in the sea."],["Ocean","Carried along by a current."],["Ocean","Sinking into deep water."],["Ocean","Still in the ocean."]],
  "Cloud":[["Ocean","You fall as rain onto the sea."],["Soil","You fall as rain onto a paddock."],["Glacier","You freeze and fall as snow on a mountain."],["River","You fall as rain into a creek."],["Cloud","Blown along by the wind."],["Cloud","Stuck to a dust speck, still condensing."]],
  "River":[["Ocean","The river reaches the sea."],["Groundwater","You soak into the riverbed (infiltration)."],["Cloud","A hot day: evaporation."],["Animal","A kangaroo drinks you."],["River","Still flowing downstream."],["River","Held in a weir pool."]],

  "Groundwater":[["River","A spring brings you up into a creek."],["Groundwater","Stored deep in rock."],["Groundwater","Moving very slowly through rock."],["Groundwater","Still underground."],["Groundwater","Still underground."],["Groundwater","Years pass..."]],
  "Glacier":[["River","Summer: you melt into a stream."],["Cloud","You turn straight to vapour (sublimation)."],["Glacier","Frozen solid."],["Glacier","Frozen solid."],["Glacier","Squashed deeper into the ice."],["Glacier","Still frozen."]],
