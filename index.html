   <div class="box"><h3>Don't forget human impacts!</h3><p>Add what you learned in Lesson 19: fossil fuel combustion, land clearing, and a bigger atmosphere reservoir.</p></div>`,
   notes:"Hand back drafts and Lesson 12 feedback."},
  {mode:"write", timer:30, h:"Build time",
   html:`<div class="grid2 fill"><div class="box"><h3>Checklist</h3><ul><li>All four spheres labelled</li><li>6+ reservoirs</li><li>Labelled arrows: photosynthesis, respiration, decomposition, combustion, ocean uptake</li><li>Fast and slow cycle shown</li><li>Human impacts</li><li>Key or legend</li></ul></div><div class="box" style="justify-content:center"><p class="lead">Teacher conferences: be ready to explain one arrow.</p></div></div>`,
   notes:"Conference with each student briefly. Ask: 'Talk me through this arrow.'"},
  {mode:"move", timer:10, h:"Gallery walk: two stars and a wish",
   html:`<div class="grid2 fill"><div class="box">${steps(["Leave your model on your desk.","Visit at least three models.","Leave two yellow sticky notes: things done well (stars).","Leave one pink sticky note: one specific improvement (wish)."])}</div><div class="box" style="justify-content:center"><p class="lead">Good wish: "Label the arrow from the factory." Unhelpful wish: "Make it better."</p></div></div>`,
   notes:"Model the difference between specific and vague feedback."},
  {mode:"write", timer:5, h:"Act on the feedback",
   html:`<div class="box fill" style="justify-content:center"><p class="lead">Read your wishes. Fix at least one now. Write on the back: <b>"I changed ___ because ___."</b></p></div>`,
   notes:"Planner evidence: final carbon cycle poster/model."},
  {mode:"check", h:"Self-assess",
   html:`<div class="box fill" style="justify-content:center"><p class="lead">Look at the rubric from Lesson 12. Circle the level you think you reached for each criterion.</p><p class="small">Week 5 traffic light.</p></div>`,
   notes:"Compare self-assessment with yours when marking."}
  ]}
);

/* ================= WEEK 6 ================= */
LESSONS.push(
{ n:21, title:"What is the greenhouse effect?",
  li:"Understand the greenhouse effect as a natural process.",
  sc:["I can explain how greenhouse gases help keep Earth warm.","I can draw a flow diagram of the greenhouse effect."],
  prep:"Clear space for the act-it-out activity. Signs or lanyards: Sun, Earth, gas molecule, sunlight, infrared.",
  slides:[
  {mode:"talk", timer:3, h:"Why is the Moon so cold at night?",
   html:`<div class="grid2 fill"><div class="box" style="justify-content:center"><p class="lead">The Moon is about the same distance from the Sun as Earth. But its surface goes from over 100&deg;C in the day to below &minus;150&deg;C at night.</p><p class="def">Why doesn't Earth do that?</p></div><div class="box">${rv("Answer","The Moon has almost no atmosphere. Earth's atmosphere, especially its greenhouse gases, holds heat in. Without them, Earth's average temperature would be about &minus;18&deg;C instead of about 15&deg;C.")}</div></div>`,
   notes:"Links back to Lesson 1: the 33 degree difference."},
  {mode:"watch", h:"How do greenhouse gases actually work?",
   html:vid("sTvqIijqvTg","How Do Greenhouse Gases Actually Work?","MinuteEarth",["What kind of energy arrives from the Sun? What kind leaves Earth?","Why do some gases trap heat and others don't?","Name the main greenhouse gases."]),
   notes:"Short and clear. Rewatch the middle section if students struggle."},
  {mode:"learn", h:"The greenhouse effect, step by step",
   html:`<div class="grid2 fill"><div class="box">${steps(["Sunlight (mostly visible light) passes through the atmosphere.","Earth's surface absorbs it and warms up.","The warm surface gives off <b>infrared</b> radiation (heat).","<b>Greenhouse gases</b> absorb some of the infrared and send it out in all directions, including back down.","Earth stays warm enough for liquid water and life."])}</div><div class="box"><h3>Greenhouse gases</h3><ul><li>Water vapour (H&#8322;O)</li><li>Carbon dioxide (CO&#8322;)</li><li>Methane (CH&#8324;)</li><li>Nitrous oxide (N&#8322;O)</li></ul><p class="small">Nitrogen and oxygen, which make up 99% of air, are <b>not</b> greenhouse gases.</p></div></div>`,
   notes:"Common misconception: greenhouse gases 'bounce' heat. They absorb and re-emit."},
  {mode:"whole", h:"Label the greenhouse effect", init:"slots",
   html:`<div class="grid2 fill" style="grid-template-columns:1.7fr 1fr"><div>${greenhouseSVG()}</div><div style="display:flex;flex-direction:column;gap:1cqw">${bankUI}<p class="small">Orange arrow: sunlight. Red dashed arrows: infrared heat from the surface.</p></div></div>`,
   notes:"Volunteers label on the board."},
  {mode:"move", timer:8, h:"Act it out: the human greenhouse",
   html:`<div class="grid2 fill"><div class="box">${steps(["Mark a big circle: the atmosphere. The centre is Earth's surface.","Five <b>gas molecules</b> stand in the atmosphere ring, arms out.","<b>Sunlight</b> students walk straight in to the surface (gases don't stop them).","At the surface they turn into <b>infrared</b> and try to walk out. If a gas molecule tags them, they go back to the surface.","Round 2: ten gas molecules. Round 3: fifteen."])}</div><div class="box"><h3>Observers count</h3><p>How many infrared students escaped each round? How many were stuck near the surface?</p>${rv("What it shows","More greenhouse gas molecules = more heat held near the surface = a warmer Earth. Round 1 is the natural greenhouse effect. Rounds 2 and 3 preview the enhanced greenhouse effect.")}</div></div>`,
   notes:"Very effective kinesthetic model. Discuss its limits afterwards (molecules absorb and re-emit rather than tag; light isn't people)."},
  {mode:"talk", timer:3, h:"Is the greenhouse effect bad?",
   html:`<div class="grid2 fill"><div class="box" style="justify-content:center"><p class="lead">Turn and talk: is the greenhouse effect good or bad?</p></div><div class="box">${rv("Answer","The natural greenhouse effect is <b>necessary</b>: without it Earth would be frozen. The problem is the <b>enhanced</b> greenhouse effect, when extra greenhouse gases trap more heat. That's next lesson.")}</div></div>`,
   notes:"Separate the natural process from the problem clearly."},
  {mode:"write", timer:8, h:"Flow diagram",
   html:`<div class="grid2 fill"><div class="box"><p class="lead">Draw a flow diagram (boxes and arrows) of the greenhouse effect in 5 steps.</p><p>Use the words: sunlight, surface, infrared, greenhouse gases, absorb, re-emit.</p></div><div class="box"><h3>Stretch</h3><p>Add which sphere each step happens in.</p></div></div>`,
   notes:"Planner evidence: greenhouse effect diagram."},
  {mode:"check", h:"Exit: true or false?", init:"vote",
   data:[["The greenhouse effect is natural.","True."],["Oxygen is a greenhouse gas.","False. Oxygen and nitrogen don't absorb infrared."],["Greenhouse gases block sunlight from reaching Earth.","False. Sunlight mostly passes through; it's the outgoing infrared that's absorbed."]],
   html:voteUI(),
   notes:""}
  ]},

{ n:22, title:"The enhanced greenhouse effect",
  li:"Distinguish the enhanced greenhouse effect from the natural greenhouse effect.",
  sc:["I can explain how extra greenhouse gases increase warming.","I can describe a cause-and-effect chain from fossil fuels to climate change."],
  prep:"",
  slides:[
  {mode:"check", h:"Retrieval",
   html:`<div class="grid3">${[["What kind of radiation do greenhouse gases absorb?","Infrared (heat) radiation."],["Name three greenhouse gases.","Water vapour, carbon dioxide, methane (also nitrous oxide)."],["Without the greenhouse effect, Earth's average temperature would be about...?","&minus;18&deg;C"]].map(c=>rv(c[0],c[1])).join("")}</div>`,
   notes:""},
  {mode:"watch", h:"Causes and effects of climate change",
   html:vid("G4H1N_yXBiA","Causes and Effects of Climate Change","National Geographic",["What human activities does the video blame?","Name three effects of a warming climate.","What solutions are mentioned?"]),
   notes:"Short overview."},
  {mode:"learn", h:"Natural versus enhanced",
   html:`<div class="grid2 fill"><div class="box tint bio"><h3 class="ink">Natural greenhouse effect</h3><ul><li>Caused by greenhouse gases that were already in the air</li><li>Keeps Earth about 33&deg;C warmer</li><li>Makes life possible</li></ul></div><div class="box tint geo"><h3 class="ink">Enhanced greenhouse effect</h3><ul><li>Caused by <b>extra</b> greenhouse gases from human activity</li><li>Traps <b>more</b> heat than before</li><li>Leads to global warming and climate change</li></ul></div></div>`,
   notes:"Students copy this comparison."},
  {mode:"group", h:"Build the chain", init:"order",
   data:[["Humans burn fossil fuels and clear land"],["More CO&#8322; builds up in the atmosphere"],["More infrared heat is absorbed and re-emitted"],["Earth's surface and oceans warm"],["Ice melts and warm seawater expands"],["Sea levels rise and weather patterns change"]],
   html:orderUI("cause","effects"),
   notes:"Groups order paper strips first."},
  {mode:"talk", timer:5, h:"What might this mean for South Australia?",
   html:`<p>Think, pair, share. Then reveal.</p><div class="grid3">${[["Heat","More frequent and intense heatwaves."],["Water","Less reliable rain in southern Australia, more pressure on the Murray."],["Fire","Longer, more dangerous bushfire seasons."],["Coasts","Rising seas and storm surges eroding beaches and cliffs."],["Oceans","Warmer, more acidic water stressing seagrass, kelp and shellfish."],["Farming","Changes to what crops grow where."]].map(c=>rv(c[0],c[1],"Predict first")).join("")}</div>`,
   notes:"Connects back to the Lesson 4 stations."},
  {mode:"whole", h:"Myth or fact?", init:"vote",
   data:[["The ozone hole causes global warming.","Myth. They are different problems. The ozone layer blocks UV; greenhouse gases trap infrared."],["CO&#8322; is only about 0.04% of the air, so it can't matter.","Myth. Small amounts of greenhouse gas trap a lot of heat. Without that tiny amount, Earth would be far colder."],["Climate has changed before, so today's change must be natural.","Misleading. Past changes had natural causes. Today's rapid warming matches the rise in CO&#8322; from human activity."],["Water vapour is a greenhouse gas.","Fact. It's the most abundant one. Warming adds more water vapour, which adds more warming."]],
   html:`<p>Stand up for fact, sit down for myth.</p>${voteUI()}`,
   notes:"Common misconceptions, especially the ozone one."},
  {mode:"write", timer:8, h:"Cause-and-effect explanation",
   html:`<div class="grid2 fill"><div class="box"><p class="lead">Explain how burning fossil fuels can lead to climate change. Use at least four linked steps.</p><p>Connective words: <i>this causes, which leads to, as a result, therefore</i>.</p></div><div class="box"><h3>Must include</h3><ul><li>carbon dioxide</li><li>infrared</li><li>enhanced greenhouse effect</li><li>one effect on South Australia</li></ul></div></div>`,
   notes:"Planner evidence: cause-and-effect explanation."},
  {mode:"check", h:"Exit",
   html:`<div class="box fill" style="justify-content:center"><p class="lead">Finish: <b>"The difference between the greenhouse effect and the enhanced greenhouse effect is..."</b></p></div>`,
   notes:""}
  ]},

{ n:23, title:"Climate change evidence",
  li:"Analyse evidence related to climate change.",
  sc:["I can interpret graphs of atmospheric CO&#8322; and temperature.","I can explain the difference between correlation and causation."],
  prep:"Data analysis worksheet (questions on slide 6).",
  slides:[
  {mode:"talk", timer:3, h:"Notice and wonder",
   html:`<div class="grid2 fill"><div class="chartbox box" id="co2Chart"></div><div class="box"><p class="lead">What do you <b>notice</b> about this graph? What do you <b>wonder</b>?</p><p class="small">Data: NOAA Global Monitoring Laboratory, annual mean CO&#8322; at Mauna Loa, Hawaii.</p></div></div>`,
   init:"climate",
   notes:"No explanation yet: let students describe first. The temperature chart element is absent here, which is fine."},
  {mode:"whole", h:"Carbon dioxide and temperature", init:"climate",
   html:`<div class="grid2 fill"><div class="box chartbox"><h3>Atmospheric CO&#8322;</h3><div id="co2Chart"></div><p class="small">NOAA Global Monitoring Laboratory, Mauna Loa annual means.</p></div><div class="box chartbox"><h3>Global temperature</h3><div id="tChart"></div><p class="small">NOAA NCEI, global land and ocean, difference from the 1901 to 2000 average (yearly mean of monthly values).</p></div></div>`,
   notes:"Real data, plotted every 5 years plus the latest available. The dashed line in the temperature chart is the 20th-century average."},
  {mode:"learn", h:"Reading the evidence carefully",
   html:`<div class="grid3 fill"><div class="box"><h3>Trend</h3><p>The overall direction. Both lines go up.</p></div><div class="box"><h3>Variation</h3><p>Temperature goes up and down year to year (El Ni&ntilde;o, La Ni&ntilde;a), but the long-term trend is up.</p></div><div class="box"><h3>Correlation is not causation</h3><p>Two things rising together doesn't prove one causes the other. Scientists also need a <b>mechanism</b> (the greenhouse effect) and other evidence.</p></div></div>`,
   notes:"The mechanism plus many independent lines of evidence is why scientists are confident."},
  {mode:"whole", h:"Correlation or causation?", init:"vote",
   data:[["Ice cream sales and shark sightings both rise in summer.","Correlation only. Hot weather causes both."],["More hours of sunlight and faster leaf disk floating.","Causation, with a mechanism: more light drives faster photosynthesis. We tested it."],["Rising CO&#8322; and rising global temperature.","Causation is supported: there is a known mechanism (greenhouse effect) and many other lines of evidence."]],
   html:voteUI(),
   notes:"Ties back to their own practical."},
  {mode:"group", timer:12, h:"Data analysis questions",
   html:`<div class="grid2 fill"><div class="box"><ol><li>What was the CO&#8322; level in 1960? In 2023?</li><li>By how much did it increase? By what percentage?</li><li>Describe the temperature trend from 1960 to 2024.</li><li>Which years were cooler than the 20th-century average?</li><li>Do the graphs prove CO&#8322; causes warming? Explain.</li></ol></div><div class="box">${rv("Answers 1 and 2","About 317 ppm and 421 ppm: an increase of about 104 ppm, roughly 33%.")}${rv("Answer 3","Temperature rose from about the 20th-century average in 1960 to about 1.3&deg;C above it in 2024, with ups and downs.")}${rv("Answer 4","1960, 1965 and 1975, which sit just below the dashed line.")}</div></div>`,
   notes:"Planner evidence: data analysis worksheet. Pairs or threes."},
  {mode:"learn", h:"Australia's evidence",
   html:`<div class="grid2 fill"><div class="box" style="justify-content:center"><p class="spot" style="font-size:5cqw;text-align:left;padding:0">1.51&deg;C</p><p class="lead">Australia's average warming since national records began in 1910.</p><p class="small">CSIRO and Bureau of Meteorology, State of the Climate 2024 (&plusmn;0.23&deg;C).</p></div><div class="box"><h3>Other evidence scientists use</h3><ul><li>Ice cores show past CO&#8322; and temperature.</li><li>Sea level measurements.</li><li>Ocean heat and acidity.</li><li>Earlier flowering and changing animal ranges.</li></ul></div></div>`,
   notes:"Australia has warmed faster than the global average."},
  {mode:"check", h:"Exit",
   html:`<div class="box fill" style="justify-content:center"><p class="lead">Write one claim about climate change, and the <b>evidence</b> from today that supports it.</p></div>`,
   notes:""}
  ]},

{ n:24, title:"South Australian connections",
  li:"Connect Earth systems learning to local environments and issues.",
  sc:["I can describe one South Australian example of Earth system interaction or human impact.","I can link it to the carbon cycle or climate."],
  prep:"Laptops for research.",
  slides:[
  {mode:"talk", timer:3, h:"A place you care about",
   html:`<div class="box fill" style="justify-content:center"><p class="lead">Think of a place in South Australia that matters to you: a beach, a park, a river, a farm. Tell your partner what makes it special, and one way it is changing.</p></div>`,
   notes:"Personal connection before the case studies."},
  {mode:"group", h:"Six SA case studies",
   html:tabs([
     ["Bushfire","<h3>Bushfire and carbon</h3><p>Fires release carbon stored in plants back into the air as CO&#8322;. Eucalypt forests can regrow and take carbon back in, but hotter, more frequent fires may not leave time to recover. The 2019 to 20 Kangaroo Island fires burned around half the island.</p><p class='small'>Spheres? Carbon cycle link?</p>"],
     ["Blue carbon","<h3>Seagrass and blue carbon</h3><p>Seagrass, mangroves and saltmarsh store carbon in the mud beneath them, sometimes for thousands of years. SA has large seagrass meadows, but thousands of hectares have been lost off Adelaide. The SA Government has a Blue Carbon Strategy to protect and restore these areas.</p><p class='small'>Why might restoring seagrass help the climate?</p>"],
     ["Murray and Coorong","<h3>The River Murray and the Coorong</h3><p>The Murray-Darling Basin carries water from four states to the sea in SA. Water taken for farms and towns, plus drought, reduces flow. The Coorong becomes saltier, affecting birds and fish.</p><p class='small'>Spheres? How might climate change affect flows?</p>"],
     ["Land clearing","<h3>Clearing native vegetation</h3><p>Since 1836, much of the native vegetation in SA's farming regions has been cleared. Clearing reduces carbon stored in plants and soil, and affects water, erosion and wildlife.</p><p class='small'>Carbon cycle link? What could restore it?</p>"],
     ["Drought","<h3>Drought</h3><p>The Millennium Drought (roughly 2001 to 2009) left the Lower Lakes so low that acid soils were exposed. Drought reduces plant growth, and so less CO&#8322; is taken up.</p><p class='small'>Which spheres were affected?</p>"],
     ["Coasts","<h3>Coastal change</h3><p>Adelaide's beaches lose sand northward over time, and sand is regularly carted back. Sea level rise and storms add pressure on beaches and soft cliffs along the Fleurieu coast.</p><p class='small'>Spheres? Link to the enhanced greenhouse effect?</p>"]
   ]),
   notes:"Groups take one case each. Facts are kept general for students to verify in research."},
  {mode:"research", timer:15, h:"Dig deeper",
   html:`<div class="grid2 fill"><div class="box">${steps(["In pairs, choose one case study.","Find two more facts from a reliable source (.gov.au, .edu.au, CSIRO, BoM, ABC).","Identify: which spheres interact? How is carbon or climate involved?","Find one thing being done about it."])}</div><div class="box"><h3>Starting points</h3><ul><li><a href="https://www.environment.sa.gov.au" target="_blank" rel="noopener">Department for Environment and Water (SA)</a></li><li><a href="https://www.bom.gov.au/state-of-the-climate/" target="_blank" rel="noopener">BoM State of the Climate</a></li><li><a href="https://www.mdba.gov.au" target="_blank" rel="noopener">Murray-Darling Basin Authority</a></li></ul></div></div>`,
   notes:"Remind students to note sources."},
  {mode:"move", timer:10, h:"One-minute pitches",
   html:`<div class="grid2 fill"><div class="box">${steps(["Each pair gets one minute to teach the class their case study.","Include: what's happening, which spheres, the carbon or climate link, and what's being done.","Audience: write one fact from each pitch."])}</div><div class="box" style="justify-content:center"><p class="lead">Stand up at the front or present from your seat with your notes.</p></div></div>`,
   notes:"Keep strictly to time."},
  {mode:"write", timer:10, h:"Local case study response",
   html:`<div class="grid2 fill"><div class="box"><p class="lead">Write a paragraph about your case study:</p><ol><li>Where and what is happening</li><li>Which spheres are interacting</li><li>How it links to the carbon cycle or climate</li><li>What land managers, communities or governments are doing</li></ol></div><div class="box"><h3>Include</h3><p>at least one fact with its source.</p></div></div>`,
   notes:"Planner evidence: local case study response."},
  {mode:"check", h:"Exit",
   html:`<div class="box fill" style="justify-content:center"><p class="lead">Name one action that would help your case study. Who would need to do it?</p><p class="small">Week 6 traffic light.</p></div>`,
   notes:""}
  ]}
);

/* ================= WEEK 7 ================= */
const linkCard=(url,title,source,note)=>`<a class="vidlink" href="${url}" target="_blank" rel="noopener"><span class="play" aria-hidden="true"></span><b>${title}</b><span>${source} &middot; ${note}</span></a>`;
LESSONS.push(
{ n:25, title:"First Nations knowledge and caring for Country",
  li:"Understand that different knowledge systems contribute to understanding Earth systems.",
  sc:["I can describe how First Nations knowledge supports sustainable environmental management.","I can connect caring for Country to systems thinking."],
  prep:"Where possible, invite a local Kaurna educator or use resources endorsed by the Kaurna community. Check your school's protocols for Acknowledgement of Country.",
  slides:[
  {mode:"whole", h:"Acknowledgement of Country",
   html:`<div class="box fill" style="justify-content:center"><p class="lead">We acknowledge the Kaurna people, Traditional Owners of the land on which we learn, and pay our respects to Elders past and present.</p><p>Aboriginal and Torres Strait Islander peoples have observed, managed and cared for Australian environments for more than 60,000 years.</p></div>`,
   notes:"Use your school's preferred wording. A student may lead it."},
  {mode:"talk", timer:4, h:"What does 'caring for Country' mean?",
   html:`<div class="grid2 fill"><div class="box" style="justify-content:center"><p class="lead">Think, pair, share: what do you think it means to <b>care for Country</b>?</p></div><div class="box">${rv("One way to explain it","For many Aboriginal peoples, Country means land, water, sky, plants, animals and people, all connected, with responsibilities to look after it. That's very close to the idea of an Earth system.")}</div></div>`,
   notes:"Accept a range of ideas. Avoid speaking for all First Nations peoples: knowledge is specific to each Country and community."},
  {mode:"learn", h:"Knowledge built from long observation",
   html:`<div class="grid3 fill"><div class="box"><h3>Seasonal knowledge</h3><p>Many Aboriginal groups recognise more than four seasons, read from signs like flowering plants, animal behaviour and weather.</p></div><div class="box"><h3>Fire management</h3><p>Cultural burning uses cool, slow, patchy fires at the right time for that Country to reduce fuel and encourage new growth.</p></div><div class="box"><h3>Systems thinking</h3><p>Caring for one part of Country (water, plants, animals, fire) is understood as affecting all the others.</p></div></div>`,
   notes:"Local seasons and practices differ between Countries. Use Kaurna sources for Kaurna Country."},
  {mode:"watch", h:"Fighting fire with fire",
   html:`<div class="vgrid">${linkCard("https://www.abc.net.au/news/2020-04-09/fighting-fire-with-fire/12134242","Fighting Fire with Fire: Victor Steffensen","ABC Australian Story","opens on ABC")}<div class="box"><h3>Watch for</h3><ol><li>How is a cultural burn different from a bushfire?</li><li>How does Victor know when and where to burn?</li><li>Which Earth spheres does cultural burning affect?</li></ol><p class="small">The full episode is about 28 minutes. Watch a section of about 10 minutes.</p></div></div>`,
   notes:"Preview and choose your section beforehand. Victor Steffensen is a Tagalaka man from far north Queensland."},
  {mode:"talk", timer:5, h:"Cultural burns and the carbon cycle",
   html:`<div class="grid3">${[["How might a cool burn affect carbon?","It burns less material and leaves big trees and much of the soil carbon intact, so less carbon is released than in a hot wildfire."],["Which spheres are involved?","All four: plants (bio), smoke and CO&#8322; (atmo), soil (geo), and water held in the landscape (hydro)."],["Why does long-term observation matter?","Like scientific data collected over decades, knowledge built over thousands of years reveals patterns a single study can't."]].map(c=>rv(c[0],c[1],"Discuss, then click")).join("")}</div>`,
   notes:"Keep claims modest: cultural burning's effects vary with Country and conditions."},
  {mode:"group", timer:8, h:"Two ways of knowing",
   html:`<div class="grid2 fill"><div class="box"><p class="lead">In groups, discuss how scientific knowledge and First Nations knowledge both:</p><ul><li>rely on careful observation</li><li>are tested over time</li><li>are passed on (papers and data; story, song, practice and Country)</li><li>help make predictions and decisions</li></ul></div><div class="box"><h3>Group task</h3><p>Write two sentences on how the two knowledge systems can work together to look after a South Australian environment.</p></div></div>`,
   notes:"Emphasise working together, not comparison or ranking."},
  {mode:"write", timer:8, h:"Reflection paragraph",
   html:`<div class="box fill" style="justify-content:center"><p class="lead">How can First Nations knowledge help us manage Earth systems sustainably? Use one example from today.</p><p class="small">Planner evidence: reflection paragraph.</p></div>`,
   notes:""},
  {mode:"check", h:"Exit",
   html:`<div class="box fill" style="justify-content:center"><p class="lead">One thing I learned today. One question I'd ask a Traditional Owner.</p></div>`,
   notes:"Questions could be shared with a visiting Kaurna educator."}
  ]},

{ n:26, title:"Review and synthesis",
  li:"Consolidate understanding of Earth systems and the carbon cycle.",
  sc:["I can explain how Earth's spheres interact to affect the carbon cycle.","I can identify what I need to revise."],
  prep:"Six station tables with the task cards (slide 4). Whiteboards for the quiz.",
  slides:[
  {mode:"write", timer:4, h:"Brain dump",
   html:`<div class="box fill" style="justify-content:center"><p class="lead">Write <b>everything</b> you remember about Earth systems in 4 minutes. Words, diagrams, arrows. No notes.</p><p class="small">Then circle the parts you're unsure about: those are your revision targets.</p></div>`,
   notes:"Retrieval practice before stations."},
  {mode:"move", h:"Revision stations",
   html:`<div class="grid2 fill"><div class="box">${steps(["Six stations, about 7 minutes each.","Do the task, then check with the answer card.","Move when the timer goes.","Spend extra time at stations you circled in your brain dump."])}</div><div class="box"><h3>Stations</h3><ol><li>The four spheres</li><li>Cycles</li><li>Carbon processes</li><li>Greenhouse effect</li><li>Human impacts</li><li>Inquiry skills</li></ol></div></div>`,
   notes:"Students may choose their order if the room allows."},
  {mode:"move", timer:7, h:"Station tasks",
   html:tabs([
     ["1. Spheres","<h3>The four spheres</h3><p>Draw the four-circle diagram from memory. Add two examples per sphere and two interactions with arrows.</p>"],
     ["2. Cycles","<h3>Cycles</h3><p>Explain the difference between energy flow and matter cycling. Name the four cycles and one process from each.</p>"],

/* ---------- timer ---------- */
let T={left:0,run:false,id:null,el:null};
function timerHTML(min){return `<div class="timer" id="timer" data-min="${min}"><span class="t" id="tDisp">${fmt(min*60)}</span><button id="tGo">Start</button><button id="tAdd" aria-label="Add one minute">+1</button><button id="tReset">Reset</button></div>`}
function fmt(s){return `${Math.floor(s/60)}:${String(s%60).padStart(2,"0")}`}
function bindTimer(){
  clearInterval(T.id);T={left:0,run:false,id:null,el:$("#timer")};if(!T.el)return;
  T.left=+T.el.dataset.min*60;
  const paint=()=>{$("#tDisp").textContent=fmt(T.left);$("#tGo").textContent=T.run?"Pause":"Start";T.el.classList.toggle("done",T.left===0)};
  const tick=()=>{if(T.left>0){T.left--;if(T.left===0){T.run=false;clearInterval(T.id);chime()}}paint()};
  T.toggle=()=>{if(T.left===0)return;T.run=!T.run;clearInterval(T.id);if(T.run)T.id=setInterval(tick,1000);paint()};
  $("#tGo").onclick=T.toggle;$("#tAdd").onclick=()=>{T.left+=60;paint()};
  $("#tReset").onclick=()=>{clearInterval(T.id);T.run=false;T.left=+T.el.dataset.min*60;paint()};paint();
}
function chime(){try{const a=new (window.AudioContext||window.webkitAudioContext)();[0,.25,.5].forEach(d=>{const o=a.createOscillator(),g=a.createGain();o.frequency.value=880;o.connect(g);g.connect(a.destination);g.gain.setValueAtTime(.18,a.currentTime+d);g.gain.exponentialRampToValueAtTime(.001,a.currentTime+d+.22);o.start(a.currentTime+d);o.stop(a.currentTime+d+.25)})}catch(e){}}

/* ---------- rendering ---------- */
const WEEKS=["Introducing Earth as a system","Cycles in Earth systems","The carbon cycle","Photosynthesis, respiration and investigation","Analysing evidence and human impacts","The greenhouse effect and climate","Consolidation and assessment"];
const wk=l=>Math.ceil(LESSONS[l].n/4);
let L=-1,S=0;
function deck(l){return [{title:true},...LESSONS[l].slides]}
function drawNav(){
  const w=L<0?0:wk(L), nav=$("#lessonNav");
  nav.innerHTML=WEEKS.map((t,i)=>`<button class="wk" data-w="${i+1}" title="Week ${i+1}: ${t}" aria-current="${w===i+1}">Wk ${i+1}</button>`).join("")
    +(w?`<span class="wkSep"></span>`+LESSONS.map((x,i)=>wk(i)===w?`<button data-l="${i}" aria-current="${i===L}">Lesson ${x.n}</button>`:"").join(""):"");
  nav.querySelectorAll("[data-w]").forEach(b=>b.onclick=()=>go(LESSONS.findIndex((x,i)=>wk(i)===+b.dataset.w),0));
  nav.querySelectorAll("[data-l]").forEach(b=>b.onclick=()=>go(+b.dataset.l,0));
}
function render(){
  const stage=$("#stage"); clearInterval(T.id); drawNav();
  if(L<0){
    stage.innerHTML=`<div class="home"><div><p class="small" style="font-family:var(--f-mono);color:var(--accent);font-weight:700">YEAR 9 SCIENCE &middot; 7 WEEKS &middot; 28 LESSONS</p><h1 style="font-size:4cqw">Earth Systems</h1><p class="lead" style="font-size:1.6cqw;max-width:70ch;margin-top:.6cqw">Spheres, cycles, carbon and climate. Every lesson mixes talk, movement, group work, videos and short writing tasks.</p></div>
    <div class="wkList">${WEEKS.map((t,w)=>`<div class="wkCol"><div title="${t}" style="display:flex;align-items:center"><h3>Week ${w+1}</h3></div>${LESSONS.map((x,i)=>wk(i)===w+1?`<button class="lc" data-go="${i}"><i>${x.n}</i><span>${x.title}</span></button>`:"").join("")}</div>`).join("")}</div></div>`;
    stage.querySelectorAll("[data-go]").forEach(b=>b.onclick=()=>go(+b.dataset.go,0));
    $("#count").textContent="";$("#progBar").style.width="0";$("#ctrl").style.visibility="hidden";$("#notes").hidden=true;$("#notesBtn").setAttribute("aria-pressed","false");save();return;
  }
  $("#ctrl").style.visibility="visible";
  const x=LESSONS[L],d=deck(L),s=d[S];
  if(s.title){
    stage.innerHTML=`<section class="slide title"><span class="num">LESSON ${x.n} OF 28 &middot; WEEK ${wk(L)}</span><h1>${x.title}</h1><div class="lisc"><div class="box"><h3>Learning intention</h3><p>${x.li}</p></div><div class="box"><h3>Success criteria</h3><ul>${x.sc.map(c=>`<li>${c}</li>`).join("")}</ul></div></div></section>`;
  } else {
    const m=MODES[s.mode]||MODES.learn;
    stage.innerHTML=`<section class="slide${s.timer?" hasTimer":""}"><div class="eyebrow"><span class="mode" style="--mc:${m[1]}">${m[0]}</span><span>Lesson ${x.n}</span>${s.timer?`<span>&middot; ${s.timer} min</span>`:""}</div><h2>${s.h}</h2>${s.html}${s.timer?timerHTML(s.timer):""}</section>`;
  }
  stage.querySelectorAll("[data-reveal]").forEach(b=>b.onclick=()=>b.classList.toggle("open"));
  stage.querySelectorAll(".tabbar").forEach(bar=>{const box=bar.parentElement;bar.querySelectorAll("[data-tab]").forEach(t=>t.onclick=()=>{bar.querySelectorAll("[data-tab]").forEach(o=>o.setAttribute("aria-selected",o===t));box.querySelectorAll("[data-panel]").forEach(p=>p.classList.toggle("on",p.dataset.panel===t.dataset.tab))})});
  if(s.init)s.init.split(" ").forEach(k=>INIT[k]&&INIT[k](s));
  bindTimer();
  $("#count").textContent=`${S+1} / ${d.length}`;$("#progBar").style.width=`${(S+1)/d.length*100}%`;
  $("#prev").disabled=S===0&&L===0;
  $("#notes").innerHTML=`<h4>Teacher notes</h4><p>${s.title?`Lesson ${x.n}. Read the learning intention aloud and ask a student to rephrase a success criterion in their own words.${x.prep?`</p><p><b>Prepare:</b> ${x.prep}`:""}`:(s.notes||"")}</p>`;
  save();
}
function go(l,s){L=l;S=s;render();try{history.replaceState(null,"",L<0?"#home":`#l${LESSONS[L].n}-${S+1}`)}catch(e){}}
function next(){if(L<0)return go(0,0);const d=deck(L);if(S<d.length-1)go(L,S+1);else if(L<LESSONS.length-1)go(L+1,0)}
function prev(){if(L<0)return;if(S>0)go(L,S-1);else if(L>0)go(L-1,deck(L-1).length-1)}
function save(){try{localStorage.setItem("es-pos",JSON.stringify([L,S]))}catch(e){}}

$("#homeBtn").onclick=()=>go(-1,0);$("#next").onclick=next;$("#prev").onclick=prev;
$("#notesBtn").onclick=()=>{const n=$("#notes");n.hidden=!n.hidden;$("#notesBtn").setAttribute("aria-pressed",!n.hidden)};
$("#fsBtn").onclick=()=>{try{document.fullscreenElement?document.exitFullscreen():document.documentElement.requestFullscreen().catch(()=>{})}catch(e){}};
document.addEventListener("keydown",e=>{if(e.target.matches("input,textarea"))return;
  if(e.key==="ArrowRight"||e.key==="PageDown"){e.preventDefault();next()}
  else if(e.key==="ArrowLeft"||e.key==="PageUp"){e.preventDefault();prev()}
  else if(e.key==="n"||e.key==="N")$("#notesBtn").click();
  else if(e.key==="t"||e.key==="T"){if(T.toggle)T.toggle()}
  else if(e.key==="f"||e.key==="F")$("#fsBtn").click()});

(function start(){
  const h=location.hash.match(/^#l(\d+)-(\d+)$/);
  if(h){const l=LESSONS.findIndex(x=>x.n===+h[1]),s=+h[2]-1;if(l>=0&&s<deck(l).length)return go(l,s)}
  let p=null;try{p=JSON.parse(localStorage.getItem("es-pos"))}catch(e){}
  if(Array.isArray(p)&&p[0]>=0&&LESSONS[p[0]]&&p[1]<deck(p[0]).length)return go(p[0],p[1]);
  go(-1,0);
})();
