  "Animal":[["Cloud","Breathed out as vapour."],["Soil","Out as urine onto the ground."],["Animal","Used inside a cell."],["Animal","Still in the body."],["Cloud","Sweat evaporates."],["Animal","Still in the body."]]
};
LESSONS.push(
{ n:5, title:"What is a cycle?",
  li:"Understand that matter cycles through Earth systems.",
  sc:["I can explain what a cycle is in science.","I can explain the difference between energy flow and matter cycling."],
  prep:"A soft ball and a handful of paper slips for the demo. Six A3 sheets with one keyword each for Glossary graffiti.",
  slides:[
  {mode:"talk", timer:3, h:"Your atoms are very, very old",
   html:`<div class="grid2 fill"><div class="box" style="justify-content:center"><p class="lead">Some of the carbon atoms in your body may once have been part of a dinosaur, a gum tree, or the air above Antarctica.</p><p class="def">How could that be true?</p></div><div class="box"><h3>Think, pair, share</h3>${steps(["Think for 1 minute.","Pair: agree on one explanation.","Share. Use the word <b>recycle</b> if you can."])}${rv("A scientist's answer","Atoms are not created or destroyed in living things. They are passed on: eaten, breathed out, decomposed, taken up again. Over millions of years the same atoms go round and round.")}</div></div>`,
   notes:"Hook. Link to conservation of mass from chemistry: atoms rearrange, they don't vanish."},
  {mode:"learn", h:"What is a cycle in science?",
   html:`<p class="def">A <b>cycle</b> is a series of changes that repeats, so matter ends up back where it started and can go around again.</p>
   <div class="grid3"><div class="box"><h3>Biogeochemical cycle</h3><p><b>Bio</b> (life) + <b>geo</b> (Earth) + <b>chemical</b>. The path a chemical substance takes through living things and the non-living Earth.</p></div><div class="box"><h3>Why matter cycles</h3><p>Earth is almost closed for matter. There is no "away". Atoms must be reused.</p></div><div class="box"><h3>Conservation of mass</h3><p>In every reaction, atoms are rearranged, not created or destroyed. Cycles are conservation of mass on a planet-sized scale.</p></div></div>`,
   notes:"Students copy the definition of cycle and biogeochemical cycle into their glossary."},
  {mode:"move", timer:5, h:"Demo: pass the matter, lose the energy",
   html:`<div class="grid2 fill"><div class="box">${steps(["Eight volunteers stand in a circle: Sun, grass, kangaroo, dingo, fungi, soil, air, grass again.","The <b>ball</b> is a carbon atom. Pass it all the way round.","The <b>paper slips</b> are energy. The Sun hands 10 slips to the grass.","Each pass, the holder drops most slips on the floor (lost as heat) and passes on the rest."])}</div>
   <div class="box"><h3>Watch for</h3><ul><li>Where does the ball end up?</li><li>Where do the paper slips end up?</li><li>Can the slips on the floor be used again?</li></ul>${rv("What we saw","The ball (matter) comes back around and can go again. The slips (energy) end up on the floor as heat and can't be reused. Matter cycles; energy flows through.")}</div></div>`,
   notes:"Physical demo, about 5 minutes. Roughly 10% of energy passes from one feeding level to the next; the rest is mostly lost as heat."},
  {mode:"learn", h:"Energy flows, matter cycles",
   html:`<div class="grid2 fill"><div class="box tint geo"><h3 class="ink">Energy: a one-way flow</h3><p>Sunlight &rarr; plants &rarr; animals &rarr; heat lost to space.</p><p>At each step most energy is lost as heat. Only about 10% is passed on.</p><p>Earth needs a <b>constant new supply</b> from the Sun.</p></div>
   <div class="box tint bio"><h3 class="ink">Matter: a cycle</h3><p>Air &rarr; plants &rarr; animals &rarr; decomposers &rarr; soil and air &rarr; plants again.</p><p>The same atoms are reused over and over.</p><p>Earth uses the <b>same supply</b> forever.</p></div></div>`,
   notes:"Key distinction for the whole unit. Draw the two shapes on the board: a straight arrow and a loop."},
  {mode:"whole", h:"Flow or cycle?", init:"vote",
   data:[["Heat from a campfire","Flow. The energy spreads out as heat and isn't reused."],["Water in a puddle","Cycle. It evaporates, falls as rain and returns."],["Sunlight on a leaf","Flow. Light energy is captured once, then passed on and lost as heat."],["Carbon in a gum leaf","Cycle. It came from the air and returns there when the leaf decomposes."],["Energy in a sandwich you eat","Flow. Used for movement and warmth, ending as heat."],["Nitrogen in soil","Cycle. Taken up by plants, eaten, returned by decomposers."]],
   html:`<p>Hands on head for <b>flow</b>, hands circling for <b>cycle</b>. Then reveal.</p>${voteUI()}`,
   notes:"Physical responses keep everyone involved. Ask a student to justify before each reveal."},
  {mode:"move", timer:8, h:"Glossary graffiti",
   html:`<div class="grid2 fill"><div class="box">${steps(["Six posters around the room, one keyword each.","Groups start at one poster with one marker.","Add a definition, a drawing or an example. 80 seconds per poster.","Move clockwise. Don't repeat what's already there; add to it."])}</div>
   <div class="grid2">${["cycle","biogeochemical","matter","energy","recycle","reservoir"].map(w=>`<div class="box" style="align-items:center;justify-content:center"><b style="font-family:var(--f-display);font-size:2cqw">${w}</b></div>`).join("")}</div></div>`,
   notes:"Reservoir is a preview of Week 3: let students guess. Use the posters as a word wall for the unit."},
  {mode:"write", timer:6, h:"Summary paragraph",
   html:`<div class="grid2 fill"><div class="box"><p class="lead">Write 3 to 4 sentences: <b>How is the way energy moves through Earth different from the way matter moves?</b></p><h3>Sentence starters</h3><ul><li>Energy enters Earth from...</li><li>Unlike energy, matter...</li><li>This is because Earth is...</li><li>An example is...</li></ul></div>
   <div class="box"><h3>Must include</h3><ul><li>cycle</li><li>flow</li><li>one example</li></ul><p class="small">Stretch: link to conservation of mass.</p></div></div>`,
   notes:"Evidence for Lesson 5: glossary and summary paragraph."},
  {mode:"check", h:"Exit: 3, 2, 1",
   html:`<div class="grid3 fill"><div class="box tint atmo" style="justify-content:center"><b class="spot ink" style="padding:0">3</b><p>things that cycle on Earth</p></div><div class="box tint hydro" style="justify-content:center"><b class="spot ink" style="padding:0">2</b><p>differences between energy and matter</p></div><div class="box tint bio" style="justify-content:center"><b class="spot ink" style="padding:0">1</b><p>question you still have</p></div></div>`,
   notes:"Collect on a slip or mini whiteboard. Use the questions to start Lesson 6."}
  ]},

{ n:6, title:"Earth's major cycles",
  li:"Identify key cycles operating within Earth systems.",
  sc:["I can name the water, carbon, nitrogen and phosphorus cycles.","I can describe the main substance, reservoirs and processes of each."],
  prep:"Print the four cycle cards (slide 5), enough for pairs. Comparison chart handout.",
  slides:[
  {mode:"check", h:"Retrieval: flow or cycle?",
   html:`<p>Mini whiteboards.</p><div class="grid3">${[["1. Define a biogeochemical cycle.","The path a substance takes through living things and the non-living Earth, and back again."],["2. Why does energy need a constant supply but matter doesn't?","Energy is lost as heat at each step. Matter is reused because Earth is almost closed for matter."],["3. Name a decomposer.","Fungi, bacteria, worms (and other detritivores)."]].map(c=>rv(c[0],c[1])).join("")}</div>`,
   notes:"Quick retrieval. Address any 3-2-1 questions from Lesson 5 here."},
  {mode:"learn", h:"Four cycles that keep life going",
   html:`<div class="grid4 fill">${[
     ["hydro","Water cycle","Water (H&#8322;O)","Every cell is mostly water. Drives weather."],
     ["atmo","Carbon cycle","Carbon (in CO&#8322;, sugars, fossil fuels, rocks)","Carbon is the backbone of every molecule in living things. Our unit focus."],
     ["bio","Nitrogen cycle","Nitrogen (N&#8322; gas, nitrates)","Needed to make proteins and DNA."],
     ["geo","Phosphorus cycle","Phosphorus (phosphates in rock)","Needed for DNA, bones and teeth, and energy in cells."]
   ].map(c=>`<div class="box tint ${c[0]}"><h3 class="ink">${c[1]}</h3><p><b>Moves:</b> ${c[2]}</p><p class="small" style="color:var(--ink)">${c[3]}</p></div>`).join("")}</div>
   <p class="small">The carbon cycle gets three whole weeks from next week. Today is the big picture.</p>`,
   notes:"Overview only. The carbon cycle is the unit focus."},
  {mode:"watch", h:"Nitrogen and phosphorus cycles",
   html:vid("leHy-Y_8nRs","Nitrogen & Phosphorus Cycles: Always Recycle! Part 2","CrashCourse Ecology",["Why can't most living things use the nitrogen in the air?","What do nitrogen-fixing bacteria do?","Why is the phosphorus cycle so slow?","What happens when too much fertiliser runs into rivers?"],"Fast-paced: pause after each cycle."),
   notes:"Pitched slightly above Year 9; pausing helps. Wattles, peas and beans have nitrogen-fixing bacteria in root nodules, a good local example."},
  {mode:"group", h:"Expert pairs",
   html:`<div class="grid2 fill"><div class="box">${steps(["Your pair is given one cycle.","Read your cycle card (next slide).","Fill in your row of the comparison chart: substance, reservoirs, processes, spheres.","Practise explaining your cycle in 30 seconds without reading."])}</div><div class="box"><h3>Comparison chart columns</h3><ul><li>Main substance</li><li>Reservoirs (where it is stored)</li><li>Key processes (how it moves)</li><li>Spheres involved</li></ul></div></div>`,
   notes:"Assign cycles so all four are covered evenly across the room."},
  {mode:"group", timer:8, h:"Cycle cards",
   html:tabs([
     ["Water","<h3 class='hydro ink'>Water cycle</h3><p><b>Reservoirs:</b> oceans (most of it), ice caps and glaciers, groundwater, lakes and rivers, the atmosphere, living things.</p><p><b>Processes:</b> evaporation, transpiration, condensation, precipitation, runoff, infiltration.</p><p><b>Spheres:</b> all four. Powered by the Sun's heat.</p>"],
     ["Carbon","<h3 class='atmo ink'>Carbon cycle</h3><p><b>Reservoirs:</b> atmosphere (CO&#8322;), plants and animals, soil, oceans, fossil fuels, rocks like limestone.</p><p><b>Processes:</b> photosynthesis, respiration, decomposition, combustion, ocean uptake.</p><p><b>Spheres:</b> all four.</p>"],
     ["Nitrogen","<h3 class='bio ink'>Nitrogen cycle</h3><p><b>Reservoirs:</b> atmosphere (78% N&#8322;), soil, living things.</p><p><b>Processes:</b> nitrogen fixation by bacteria (and a little by lightning), uptake by plants, eating, decomposition, denitrification back to N&#8322;.</p><p><b>Spheres:</b> atmosphere, biosphere, geosphere (soil), hydrosphere.</p>"],
     ["Phosphorus","<h3 class='geo ink'>Phosphorus cycle</h3><p><b>Reservoirs:</b> rocks and sediments (most), soil, ocean, living things.</p><p><b>Processes:</b> weathering of rock, uptake by plants, eating, decomposition, settling into ocean sediments, uplift into new rock.</p><p><b>Spheres:</b> geosphere, hydrosphere, biosphere. Almost none in the atmosphere, so it is very slow.</p>"]
   ]),
   notes:"Display the tabs or print them."},
  {mode:"move", timer:8, h:"Inside-outside circle",
   html:`<div class="grid2 fill"><div class="box">${steps(["Half the class forms an inner circle facing out. Half forms an outer circle facing in.","Explain your cycle to the person opposite in 30 seconds. Then swap.","Outer circle moves two people clockwise.","Repeat until you have heard all four cycles."])}</div>
   <div class="box" style="justify-content:center"><p class="lead">Listener's job: fill in the row of the chart for the cycle you just heard.</p></div></div>`,
   notes:"Make sure pairs are split, one partner per circle, so every cycle is in both circles."},
  {mode:"whole", h:"Check the comparison chart", init:"cells",
   html:`<div class="tablewrap"><table class="ctable"><thead><tr><th>Cycle</th><th>Main substance</th><th>Main reservoirs</th><th>Key processes</th><th>Spheres</th></tr></thead><tbody>${[
     ["Water","H&#8322;O","Oceans, ice, groundwater","Evaporation, condensation, precipitation, runoff","All four"],
     ["Carbon","Carbon (CO&#8322;, sugars)","Rocks, oceans, soil, fossil fuels, air","Photosynthesis, respiration, decomposition, combustion","All four"],
     ["Nitrogen","N&#8322;, nitrates","Atmosphere, soil","Fixation, uptake, decomposition, denitrification","Mostly atmo, bio, geo (soil)"],
     ["Phosphorus","Phosphates","Rocks, sediments","Weathering, uptake, decomposition, sedimentation","Geo, hydro, bio (not atmo)"]
   ].map(r=>`<tr><th>${r[0]}</th>${r.slice(1).map(c=>`<td class="rcell">${c}</td>`).join("")}</tr>`).join("")}</tbody></table></div><div class="row"><button class="btn" id="cellsAll">Reveal all</button><span class="small">Click any cell to reveal it.</span></div>`,
   notes:"Students self-check with a different coloured pen."},
  {mode:"check", h:"Exit: which cycle?", init:"vote",
   data:[["Bacteria in wattle roots turn a gas from the air into food for the plant.","Nitrogen"],["Mined from rock to make fertiliser.","Phosphorus (nitrogen fertilisers are made too, but not mined from rock)"],["Has almost no gas stage, so it moves very slowly.","Phosphorus"],["Moves when you breathe out.","Carbon (as CO&#8322;), and water vapour too!"],["Evaporation and condensation.","Water"]],
   html:`<p>Hold up fingers: 1 water, 2 carbon, 3 nitrogen, 4 phosphorus.</p>${voteUI()}`,
   notes:"Quick-fire. Note anyone who struggles with nitrogen versus phosphorus."}
  ]},

{ n:7, title:"The water cycle",
  li:"Describe the main processes in the water cycle.",
  sc:["I can explain evaporation, condensation, precipitation and runoff.","I can trace a water molecule through all four spheres."],
  prep:"Eight station signs (Ocean, Cloud, River, Soil, Groundwater, Glacier, Plant, Animal) around the room. One die per station if you prefer stations to roll themselves.",
  slides:[
  {mode:"talk", timer:2, h:"Is the water in your bottle older than the dinosaurs?",
   html:`<div class="grid2 fill"><div style="display:grid;place-items:center">${globeSVG()}</div><div class="box" style="justify-content:center"><p class="lead">Turn to your partner: yes or no? Why?</p>${rv("Answer","Almost certainly yes. Most of Earth's water has been here for billions of years, cycling between ocean, air, land and living things. A dinosaur may well have drunk some of it.")}</div></div>`,
   notes:"Quick hook that links back to Lesson 5."},
  {mode:"watch", h:"How the water cycle works",
   html:vid("al-do-HGuIk","Water Cycle: How the Hydrologic Cycle Works","National Science Foundation",["List every process the video names.","Where is most of Earth's water stored?","What powers the water cycle?"]),
   notes:"Students list processes while watching, then compare with a partner."},
  {mode:"learn", h:"The water cycle processes",
   html:`<div class="grid3 fill">${[
     ["Evaporation","Liquid water turns into water vapour, mostly from the ocean, powered by the Sun.","hydro"],
     ["Transpiration","Water evaporates from the tiny pores in plant leaves.","bio"],
     ["Condensation","Water vapour cools and turns back into tiny droplets, making clouds.","atmo"],
     ["Precipitation","Droplets join and fall as rain, hail or snow.","atmo"],
     ["Runoff","Water flows over the land into creeks, rivers and the sea.","geo"],
     ["Infiltration","Water soaks into the soil and down into groundwater.","geo"]
   ].map(c=>`<div class="box tint ${c[2]}"><h3 class="ink">${c[0]}</h3><p>${c[1]}</p></div>`).join("")}</div>`,
   notes:"Planner focus: evaporation, condensation, precipitation, runoff. Transpiration and infiltration add depth."},
  {mode:"whole", h:"Label the water cycle", init:"slots",
   html:`<div class="grid2 fill" style="grid-template-columns:1.7fr 1fr"><div>${waterSVG()}</div><div style="display:flex;flex-direction:column;gap:1cqw">${bankUI}<p class="small">Dashed arrow: from a plant's leaves.</p></div></div>`,
   notes:"Students come up and label. Then they draw and label their own copy (planner evidence)."},
  {mode:"move", h:"The incredible journey: you are a water molecule", init:"dice",
   data:WATER_DICE,
   html:`<div class="grid2 fill" style="grid-template-columns:1.1fr 1fr"><div style="display:flex;flex-direction:column;gap:1cqw"><p class="small">Everyone starts at a station. Choose that station, roll, and move to where the die sends you. Record each stop.</p><div class="stations" id="stations"></div><div class="row"><div class="die" id="die">?</div><button class="btn primary" id="roll">Roll</button></div></div>
   <div class="box"><div id="diceOut"></div><p class="small">Your journey:</p><div class="journey" id="journey"></div></div></div>`,
   notes:"Run as a physical game: students spread across the 8 stations, each station rolls (on the board or with a real die) and students move. 8 to 10 rolls. Then: who got stuck in groundwater or a glacier? That's realistic: water can stay there for thousands of years."},
  {mode:"talk", timer:4, h:"Debrief the journey",
   html:`<div class="grid3">${[["Who got stuck?","Groundwater and glaciers hold water for a very long time. Some groundwater is thousands of years old."],["Who visited the most spheres?","Count them: hydrosphere, atmosphere, geosphere (soil, rock), biosphere (plants, animals)."],["Was anyone's journey the same?","No. The water cycle is not one neat loop; it's many possible paths."]].map(c=>rv(c[0],c[1],"Discuss, then click")).join("")}</div>`,
   notes:"Key idea: the textbook circle is a simplification."},
  {mode:"whole", h:"Is fresh water in SA renewable?", init:"vote",
   data:[["Water is a renewable resource.","Mostly agree: it keeps cycling. But..."],["Fresh water in South Australia will always be easy to get.","Adelaide is in one of the driest states. In droughts, the Murray and reservoirs run low. Adelaide has a desalination plant at Lonsdale that turns seawater into drinking water."],["Groundwater is renewable.","Only if we use it slower than rain refills it. Some groundwater takes thousands of years to refill."]],
   html:`<p><b>Continuum line:</b> one wall is "strongly agree", the opposite wall "strongly disagree". Stand where you think, then justify.</p>${voteUI("Show a scientist's view")}`,
   notes:"The Adelaide Desalination Plant at Lonsdale is close to Seaford, a strong local hook."},
  {mode:"write", timer:6, h:"Your molecule's story",
   html:`<div class="grid2 fill"><div class="box"><p class="lead">Write your water molecule's journey from the game as a short story (4 to 6 sentences).</p><p>Use at least <b>four</b> process words and name the <b>sphere</b> at each stop.</p></div><div class="box"><h3>Word bank</h3><p>evaporation &middot; transpiration &middot; condensation &middot; precipitation &middot; runoff &middot; infiltration &middot; hydrosphere &middot; atmosphere &middot; geosphere &middot; biosphere</p></div></div>`,
   notes:"Fun, low-stakes writing that shows process understanding."},
  {mode:"check", h:"Exit: hinge question",
   html:`<div class="box"><p><b>On a cold morning, water droplets form on the outside of a cold drink can. Which process is this?</b></p><ol><li>Evaporation</li><li>Condensation</li><li>Precipitation</li><li>Transpiration</li></ol></div>${rv("Answer","2. Condensation: water vapour in the air cools on the cold can and turns back to liquid. The water came from the air, not through the can.")}`,
   notes:"A common misconception is that water leaks through the can."}
  ]},

{ n:8, title:"Earth's cycles are interconnected",
  li:"Understand that Earth's cycles are linked.",
  sc:["I can explain how one Earth cycle affects another.","I can identify processes that belong to both the water and carbon cycles."],
  prep:"A ball of wool and 10 role cards for the web (Sun, ocean, cloud, gum tree, kangaroo, soil, fungi, CO2 in air, rock, river).",
  slides:[
  {mode:"check", h:"Retrieval",
   html:`<div class="grid3">${[["Name the process: plant leaves release water vapour.","Transpiration"],["Name two carbon reservoirs.","Atmosphere, plants, soil, oceans, fossil fuels, rocks"],["Which cycle has almost no gas stage?","Phosphorus"]].map(c=>rv(c[0],c[1])).join("")}</div>`,
   notes:"Whiteboards."},
  {mode:"watch", h:"The water and carbon cycles together",
   html:vid("2D7hZpIYlCA","The Hydrologic and Carbon Cycles: Always Recycle!","CrashCourse Ecology",["Name one way water and carbon both move through plants.","How do oceans store carbon?","What did the video say humans are doing to the carbon cycle?"],"Fast-paced: pause when it switches from water to carbon."),
   notes:"Preview of Week 3 too. Pause often."},
  {mode:"learn", h:"Where the cycles meet",
   html:`<div class="grid2 fill">${[
     ["Plants","Photosynthesis uses water <b>and</b> CO&#8322;. Transpiration releases water vapour. One leaf runs two cycles."],
     ["Oceans","The ocean is the biggest store in the water cycle, and it absorbs CO&#8322; from the air. Cold water holds more CO&#8322; than warm water."],
     ["Rain and rock","Rain dissolves a little CO&#8322;, making it slightly acidic. It slowly dissolves limestone, moving carbon from rock into rivers."],
     ["Decomposition","Decomposers need moisture. Wet soils rot faster, releasing CO&#8322;. Drought slows decomposition."]
   ].map(c=>`<div class="box"><h3>${c[0]}</h3><p>${c[1]}</p></div>`).join("")}</div>`,
   notes:"These four links come back in the poster task."},
  {mode:"group", h:"Water, carbon, or both?", init:"sort",
   data:{zones:[["water","Water cycle","hydro"],["both","Both","bio"],["carbon","Carbon cycle","atmo"]],
     items:[["Evaporation","water"],["Condensation","water"],["Precipitation","water"],["Transpiration","water"],["Photosynthesis","both"],["Respiration","both"],["Ocean absorbing CO&#8322;","both"],["Rain dissolving limestone","both"],["Fossil fuel formation","carbon"],["Combustion","carbon both"],["Decomposition","carbon both"]],
     note:"Combustion and decomposition can go in Carbon or Both: both release water too."},
   html:`<p class="small">Groups decide first, then sort on the board.</p>${sortUI}`,
   notes:"Respiration releases CO2 and water vapour; photosynthesis uses both. Accept justified answers."},
  {mode:"move", timer:8, h:"The web of life",
   html:`<div class="grid2 fill"><div class="box">${steps(["Ten students take a role card and stand in a circle.","The Sun holds the wool and passes it to something it affects, saying how.","Keep passing until everyone is connected (cross the circle as many times as you can).","Then the teacher announces a change. Anyone who feels a tug, sit down if you're affected."])}</div>
   <div class="box"><h3>Changes to announce</h3><ul><li>A drought: the river dries up.</li><li>The gum trees are cleared.</li><li>The ocean warms up.</li></ul><p class="small">Watching students: count how many parts were affected by one change.</p></div></div>`,
   notes:"Classic systems demo. Outside or a cleared space works best. The rest of the class narrate each pass."},
  {mode:"talk", timer:5, h:"What if?",
   html:`<p>Turn and talk. Predict the knock-on effects across <b>both</b> cycles, then reveal.</p><div class="grid3">${[["A long drought","Less rain &rarr; plants grow less &rarr; less CO&#8322; taken from the air. Decomposition slows. Bushfire risk rises, which releases carbon."],["The ocean warms","Warm water holds less CO&#8322;, so more stays in the air. More evaporation adds water vapour, which also traps heat."],["A forest is cleared","Less transpiration, so less local rain. Less photosynthesis. Burning or rotting wood releases CO&#8322;."]].map(c=>rv(c[0],c[1],"Predict, then click")).join("")}</div>`,
   notes:"Foreshadows human impacts (Week 5) and climate (Week 6)."},
  {mode:"write", timer:6, h:"Cycles connect because...",
   html:`<div class="grid2 fill"><div class="box"><p class="lead">Complete the sentence three ways, each using a different example:</p><p class="def">"The water cycle and the carbon cycle are connected because..."</p></div><div class="box"><h3>Ideas</h3><p>plants &middot; oceans &middot; rain and rock &middot; decomposition &middot; drought &middot; fire</p><p class="small">Stretch: add the nitrogen cycle to one of your examples.</p></div></div>`,
   notes:"Evidence for Lesson 8: short written explanation."},
  {mode:"check", h:"Exit: Week 2 traffic light",
   html:`<div class="grid3 fill">${[["bio","Green","I can explain how matter cycles and how cycles connect."],["geo","Orange","I get most of it but mix up some processes."],["bad","Red","I need help with cycles."]].map(c=>`<div class="box" style="border-color:var(--${c[0]});justify-content:center"><h3 style="color:var(--${c[0]})">${c[1]}</h3><p>${c[2]}</p></div>`).join("")}</div><p class="small">Write your colour and one process you understand well on a sticky note.</p>`,
   notes:"Use reds to form a small group in Lesson 9."}
  ]}
);

  prep:"Mini whiteboards. Carbon reservoirs table handout (optional).",

  {mode:"move", timer:3, h:"Carbon hunt",
   html:`<div class="grid2 fill"><div class="box" style="justify-content:center"><p class="lead">In pairs, you have 3 minutes to list <b>as many things in this room that contain carbon</b> as you can.</p><p>You may walk around. Don't touch other people's things.</p></div><div class="box">${rv("How did you go?","Nearly everything! Paper, wooden desks, plastic chairs, pencils (graphite is pure carbon), clothes, food, the CO&#8322; in the air, and every person in the room.")}<p class="small">Winning pair: the most items they can justify.</p></div></div>`,
   notes:"Fast, physical start. Push students to justify plastic (made from oil, which came from ancient life)."},
  {mode:"learn", h:"Why carbon matters",
   html:`<div class="grid3 fill"><div class="box"><h3>The backbone of life</h3><p>Carbon atoms can join in long chains and rings, forming sugars, fats, proteins and DNA. All living things are built on carbon.</p></div><div class="box"><h3>You are part carbon</h3><p>About 18% of your body mass is carbon. Only oxygen makes up more.</p></div><div class="box"><h3>It controls climate</h3><p>Carbon dioxide in the air traps heat. Small changes in how much is in the air change Earth's temperature (Week 6).</p></div></div>`,
   notes:"Short explicit teaching."},
  {mode:"learn", h:"Carbon reservoirs",
   html:`<p class="def">A <b>reservoir</b> (or store) is a place where carbon is held for a time. Carbon moves between reservoirs through processes.</p>
   <div class="grid4">${[["atmo","Atmosphere","CO&#8322; and methane gas"],["bio","Living things","Sugars, wood, muscle"],["geo","Soil","Dead plant and animal material (humus)"],["hydro","Oceans","Dissolved CO&#8322;, shells, sea life"],["geo","Fossil fuels","Coal, oil, natural gas"],["geo","Rocks","Limestone and chalk"]].map(c=>`<div class="box tint ${c[0]}"><h3 class="ink">${c[1]}</h3><p class="small" style="color:var(--ink)">${c[2]}</p></div>`).join("")}</div>
   <p class="small">A <b>sink</b> takes in more carbon than it releases. A <b>source</b> releases more than it takes in.</p>`,
   notes:"Introduce sink and source; they matter in Week 5."},
  {mode:"group", h:"Biggest to smallest", init:"order",
   data:[["Rocks (limestone)","over 60 million"],["Deep ocean","about 37,000"],["Soil","about 1,500 to 2,400"],["Atmosphere","about 870"],["Plants","about 450 to 650"],["Animals","about 2"]],
   html:`<p class="small">Groups of 3: rank these reservoirs from the <b>most</b> carbon to the <b>least</b>. Then click them in order. Numbers revealed are billions of tonnes of carbon (approximate scientific estimates).</p>${orderUI("most carbon","least carbon")}`,
   notes:"Surprises: soil holds more than plants and the air combined; animals are tiny. Estimates are rounded from IPCC and published studies and vary between sources. Fossil fuels are left out because estimates vary widely."},
  {mode:"whole", h:"Quick or slow?", init:"sort",
   data:{zones:[["fast","Carbon moves in years to centuries","bio"],["slow","Carbon stays for millions of years","geo"]],
     items:[["Atmosphere","fast"],["Leaves","fast"],["Animals","fast"],["Soil","fast"],["Surface ocean","fast"],["Coal","slow"],["Limestone","slow"],["Oil and gas","slow"]],
     note:"The slow reservoirs matter: burning fossil fuels moves 'slow' carbon into the 'fast' cycle."},
   html:`<p class="small">How long does carbon usually stay in each reservoir?</p>${sortUI}`,
   notes:"Key idea for later: fossil fuels move carbon from the slow cycle into the fast cycle very quickly."},
  {mode:"write", timer:8, h:"Carbon reservoirs table",
   html:`<div class="tablewrap"><table class="ctable"><thead><tr><th>Reservoir</th><th>Form of carbon</th><th>Sphere</th><th>Fast or slow?</th></tr></thead><tbody>${["Atmosphere","Plants","Animals","Soil","Oceans","Fossil fuels","Rocks"].map(r=>`<tr><th>${r}</th><td></td><td></td><td></td></tr>`).join("")}</tbody></table></div><p class="small">Copy and complete in your book. This is today's evidence.</p>`,
   notes:"Planner evidence: carbon reservoirs table."},
  {mode:"check", h:"Exit: true or false?", init:"vote",
   data:[["There is more carbon in the air than in all the world's soil.","False. Soil holds roughly twice as much."],["Fossil fuels were once living things.","True. They formed from plants and tiny sea creatures buried millions of years ago."],["Carbon in limestone can stay there for millions of years.","True."]],
   html:`<p>Thumbs up true, thumbs down false.</p>${voteUI()}`,
   notes:"Quick check before processes next lesson."}
  ]},

{ n:10, title:"Carbon cycle processes",
  li:"Describe the key processes in the carbon cycle.",
  sc:["I can explain how carbon moves through photosynthesis, respiration, decomposition and combustion.","I can say whether each process adds or removes CO&#8322; from the air."],
  prep:"Seven station signs (Atmosphere, Plants, Animals, Soil, Ocean, Fossil fuels, Rocks). Coloured pencils (green and red) for the diagram.",
  slides:[
  {mode:"check", h:"Retrieval",
   html:`<div class="grid3">${[["What is a carbon reservoir?","A place where carbon is stored for a time."],["Name the biggest carbon reservoir.","Rocks (limestone and other sedimentary rock)."],["What is the difference between a sink and a source?","A sink takes in more carbon than it releases; a source releases more."]].map(c=>rv(c[0],c[1])).join("")}</div>`,
   notes:"Whiteboards."},
  {mode:"learn", h:"Four big processes",
   html:`<div class="grid2 fill">${[
     ["bio","Photosynthesis","Plants take CO&#8322; from the air and use sunlight to make sugar.","Removes CO&#8322; from the air"],
     ["atmo","Respiration","All living things break down sugar for energy and release CO&#8322;.","Adds CO&#8322; to the air"],
     ["geo","Decomposition","Fungi and bacteria break down dead things and waste, releasing CO&#8322;.","Adds CO&#8322; to the air"],
     ["hydro","Combustion","Burning wood or fossil fuels releases CO&#8322; quickly.","Adds CO&#8322; to the air"]
   ].map(c=>`<div class="box tint ${c[0]}"><h3 class="ink">${c[1]}</h3><p>${c[2]}</p><p><b style="color:${c[3].startsWith("Removes")?"var(--good)":"var(--bad)"}">${c[3]}</b></p></div>`).join("")}</div><p class="small">Also: the ocean absorbs and releases CO&#8322;, and some carbon is buried to form fossil fuels and rock over millions of years.</p>`,
   notes:"Colour code: green for removes, red for adds. Students use the same colours on their diagram."},
  {mode:"whole", h:"Label the carbon cycle", init:"slots",
   html:`<div class="grid2 fill" style="grid-template-columns:1.7fr 1fr"><div>${carbonSVG()}</div><div style="display:flex;flex-direction:column;gap:1cqw">${bankUI}<p class="small">Then copy it and colour-code: green arrows remove CO&#8322; from the air, red arrows add it.</p></div></div>`,
   notes:"Planner evidence: carbon cycle process diagram, colour-coded."},
  {mode:"move", h:"Carbon atom journey", init:"dice",
   data:CARBON_DICE,
   html:`<div class="grid2 fill" style="grid-template-columns:1.1fr 1fr"><div style="display:flex;flex-direction:column;gap:1cqw"><p class="small">Start at a station. Roll, move, and record each stop and the <b>process</b> that moved you.</p><div class="stations" id="stations"></div><div class="row"><div class="die" id="die">?</div><button class="btn primary" id="roll">Roll</button></div></div>
   <div class="box"><div id="diceOut"></div><p class="small">Your journey:</p><div class="journey" id="journey"></div></div></div>`,
   notes:"Physical game like the water journey. 10 rolls. Students record station and process each time. Ask: who got stuck in fossil fuels or rocks? That's the slow cycle."},
  {mode:"talk", timer:4, h:"Journey debrief",
   html:`<div class="grid3">${[["Which station was hardest to leave?","Fossil fuels and rocks: carbon can stay there for millions of years."],["Which process moved you most often?","Usually respiration or photosynthesis: these are the fast, everyday carbon moves."],["What did the game get wrong?","Real carbon moves continuously, amounts differ hugely between reservoirs, and humans now burn fossil fuels far more often than '1 in 6'."]].map(c=>rv(c[0],c[1],"Discuss, then click")).join("")}</div>`,
   notes:"Evaluating the model is a good science inquiry skill."},
  {mode:"whole", h:"Adds or removes CO&#8322;?", init:"sort",
   data:{zones:[["add","Adds CO&#8322; to the air",""],["remove","Removes CO&#8322; from the air","bio"]],
     items:[["Photosynthesis","remove"],["Respiration","add"],["Decomposition","add"],["Burning coal","add"],["A bushfire","add"],["Ocean absorbing CO&#8322;","remove"],["Volcanic eruption","add"],["A forest growing","remove"]]},
   html:sortUI,
   notes:"Quick consolidation before the quiz."},
  {mode:"check", h:"Retrieval quiz: team battle", init:"quiz",
   data:[["Which process removes CO&#8322; from the air?",["Respiration","Photosynthesis","Combustion","Decomposition"],1,"Photosynthesis takes CO&#8322; in to make sugar."],["Which living things carry out respiration?",["Animals only","Plants only","All living things","Only decomposers"],2,"Every living thing, plants included, respires."],["Burning petrol in a car is an example of...",["Photosynthesis","Combustion","Decomposition","Fossilisation"],1,"Combustion releases carbon stored for millions of years."],["Fungi breaking down a fallen log is...",["Decomposition","Photosynthesis","Combustion","Evaporation"],0,"Decomposers respire, releasing CO&#8322;."],["Where does most of a tree's carbon come from?",["The soil","Water","The air","Sunlight"],2,"Carbon comes from CO&#8322; in the air. Next week we'll see why this surprises most people."]],
   html:quizUI,
   notes:"Teams of 4 to 6 with a whiteboard each. All teams answer, then reveal and score."}
  ]},

{ n:11, title:"The carbon cycle and Earth's spheres",
  li:"Explain how the carbon cycle depends on interactions between spheres.",
  sc:["I can link carbon movements to the atmosphere, biosphere, hydrosphere and geosphere.","I can write a scientific explanation of a carbon cycle process."],
  prep:"Butcher paper, two colours of sticky notes and markers per group.",
  slides:[
  {mode:"check", h:"Retrieval: name the process",
   html:`<div class="grid4">${[["A kangaroo breathes out","Respiration"],["Seagrass in sunlight","Photosynthesis"],["A log rotting","Decomposition"],["A gas stove burning","Combustion"]].map(c=>rv(c[0],c[1])).join("")}</div>`,
   notes:"Fast warm-up."},
  {mode:"watch", h:"The global carbon cycle",
   html:vid({mp4:"https://abceducationmedia.akamaized.net/4477599164001/ABC-LIC-SCI256_576.mp4?source=web&content_id=13607624", page:"https://www.abc.net.au/education/keeping-up-with-carbon/13607624", poster:"https://live-production.wcms.abc-cdn.net.au/afa03505a62b4d93726d92c7be6421ac?impolicy=wcms_crop_resize&cropH=360&cropW=639&xPos=0&yPos=0&width=862&height=485"},"Keeping up with carbon","NASA, via ABC Education (Years 9 and 10), 5 min",["Where is carbon stored? Name as many places as you can.","Which movements of carbon are fast, and which are slow?","What does the video say about the ocean?"]),
   notes:"NASA clip hosted by ABC Education, tagged for Years 9 and 10, 5 min 24 s. Plays straight from the ABC; if the school network blocks it, use the ABC Education link under the video."},
  {mode:"whole", h:"Which spheres does each process connect?", init:"cells",
   html:`<div class="tablewrap"><table class="ctable"><thead><tr><th>Process</th><th>Carbon moves from...</th><th>...to</th></tr></thead><tbody>${[
     ["Photosynthesis","Atmosphere (CO&#8322;)","Biosphere (plants)"],["Respiration","Biosphere","Atmosphere"],["Decomposition","Biosphere (dead matter)","Atmosphere, and geosphere (soil)"],["Combustion of fossil fuels","Geosphere","Atmosphere"],["Ocean uptake","Atmosphere","Hydrosphere"],["Shells forming limestone","Hydrosphere and biosphere","Geosphere"],["Volcanic eruption","Geosphere","Atmosphere"]
   ].map(r=>`<tr><th>${r[0]}</th><td class="rcell">${r[1]}</td><td class="rcell">${r[2]}</td></tr>`).join("")}</tbody></table></div><div class="row"><button class="btn" id="cellsAll">Reveal all</button><span class="small">Pairs predict each cell, then click.</span></div>`,
   notes:"Students should see every process is an interaction between spheres."},
  {mode:"group", timer:12, h:"Build a giant carbon cycle",
   html:`<div class="grid2 fill"><div class="box">${steps(["Groups of 4. Draw four big zones on butcher paper: atmosphere, biosphere, hydrosphere, geosphere.","One colour sticky note for <b>reservoirs</b>, another for <b>processes</b>.","Place reservoirs in the right sphere. Draw arrows and stick a process note on each arrow.","Circle every arrow that crosses between two spheres."])}</div>
   <div class="box"><h3>Must include</h3><ul><li>At least 6 reservoirs</li><li>Photosynthesis, respiration, decomposition, combustion, ocean uptake</li><li>One slow-cycle arrow (fossil fuels or rock)</li></ul><p class="small">Roles: scribe, sticky-note manager, checker, presenter.</p></div></div>`,
   notes:"Planner: one large carbon cycle model. Keep the posters for Lesson 12."},
  {mode:"move", timer:4, h:"Two stay, two stray",
   html:`<div class="grid2 fill"><div class="box">${steps(["Two people stay and explain your poster.","Two people visit another group's poster.","Visitors find one thing the other group did better, and one arrow they're unsure about.","Return and improve your poster."])}</div><div class="box" style="justify-content:center"><p class="lead">Visitors ask: "Which spheres does this arrow connect?"</p></div></div>`,
   notes:"Quick peer review and movement."},
  {mode:"learn", h:"How to write a scientific explanation (I do)",
   html:`<div class="grid2 fill"><div class="box"><h3>Model paragraph</h3><p><span class="chip bio">Claim</span> Photosynthesis moves carbon from the atmosphere into the biosphere. <span class="chip atmo">Process</span> Plants take in carbon dioxide through their leaves and use energy from sunlight to turn it into glucose. <span class="chip hydro">Evidence/example</span> For example, a river red gum stores this carbon in its wood for hundreds of years. <span class="chip geo">Link</span> This shows that the carbon cycle depends on interactions between the atmosphere and the biosphere.</p></div>
   <div class="box"><h3>The structure</h3><ol><li><b>Claim:</b> which spheres, which direction</li><li><b>Process:</b> how it happens</li><li><b>Example:</b> a real, ideally local, example</li><li><b>Link:</b> back to spheres interacting</li></ol></div></div>`,
   notes:"I do: read it aloud, pointing at each part. We do: build one together for respiration on the board before students write."},
  {mode:"write", timer:8, h:"You do: write your own",
   html:`<div class="grid2 fill"><div class="box"><p class="lead">Choose <b>decomposition</b>, <b>combustion</b> or <b>ocean uptake</b>. Write one paragraph using Claim, Process, Example, Link.</p></div><div class="box"><h3>Check before you finish</h3><ul><li>I named two spheres.</li><li>I said which direction carbon moves.</li><li>I used a real example.</li><li>I used the word "interaction".</li></ul></div></div>`,
   notes:"Planner evidence: paragraph explanation."},
  {mode:"check", h:"Exit: partner check",
   html:`<div class="box fill" style="justify-content:center"><p class="lead">Swap paragraphs. Highlight each of the four parts in a different colour. Anything missing? Write one suggestion.</p><p class="small">Two stars and a wish if time.</p></div>`,
   notes:"Collect paragraphs to check before the poster task."}
  ]},

{ n:12, title:"Carbon cycle poster planning",
  li:"Organise understanding of the carbon cycle into a scientific model.",
  sc:["I can plan an accurate representation of the carbon cycle.","I can use the criteria to improve a draft."],
  prep:"A3 paper for drafts. Copies of the checklist.",
  slides:[
  {mode:"learn", h:"Your task: a carbon cycle model",
   html:`<div class="grid2 fill"><div class="box"><p class="lead">Create a scientific representation of the carbon cycle that someone who missed this unit could learn from.</p><p>Formats: poster, 3D model, comic strip, digital diagram, or a short annotated animation.</p><p class="small">Planned today, built in Lesson 20.</p></div>
   <div class="box"><h3>Checklist: must show</h3><ul><li>All four spheres, clearly labelled</li><li>At least 6 carbon reservoirs</li><li>Arrows showing carbon movement</li><li>Processes labelled on arrows (photosynthesis, respiration, decomposition, combustion, ocean uptake)</li><li>Human impacts</li><li>A key or legend</li></ul></div></div>`,
   notes:"Formative task from the planner."},
  {mode:"whole", h:"What does great look like?",
   html:`<div class="tablewrap"><table class="ctable"><thead><tr><th>Criterion</th><th>Developing</th><th>Proficient</th><th>Excellent</th></tr></thead><tbody>${[
     ["Spheres and reservoirs","Some spheres or reservoirs missing","All four spheres and 6 reservoirs","Reservoirs placed in correct spheres, with sizes compared"],
     ["Processes and arrows","Arrows unlabelled or wrong direction","All main processes labelled correctly","Arrows show fast and slow cycles"],
     ["Human impacts","Mentioned","Shown with arrows","Explained with an SA example"],
     ["Communication","Hard to follow","Clear layout, key, labels","Could teach someone the whole cycle"]
   ].map(r=>`<tr><th>${r[0]}</th>${r.slice(1).map(c=>`<td>${c}</td>`).join("")}</tr>`).join("")}</tbody></table></div>`,
   notes:"Adapt wording to your school's achievement standard language if needed."},
  {mode:"talk", timer:5, h:"Critique three sample posters",
   html:`<div class="grid3">${[["Poster A","Beautiful drawings and colours. Lots of arrows, but none are labelled. No key.","Pretty but not scientific: we can't tell what each arrow means."],["Poster B","Every process labelled, every reservoir present. Tiny writing, arrows cross everywhere.","Accurate but hard to read. Needs a clearer layout."],["Poster C","Four sphere zones, colour-coded arrows with a key, short labels, a human impacts corner.","Best: accurate AND clear."]].map(c=>rv(`${c[0]}: ${c[1]}`,c[2],"Which is best? Why? Then click")).join("")}</div>`,
   notes:"Students rank the three, then discuss. Pulls out the criteria in their own words."},
  {mode:"talk", timer:3, h:"Choose your format",
   html:`<div class="box fill" style="justify-content:center"><p class="lead">Tell your partner which format you'll use and <b>one reason</b> it suits you. Partner asks: "How will you show the arrows clearly?"</p></div>`,
   notes:"Choice increases engagement; steer students who choose animation toward a manageable scope."},
  {mode:"write", timer:15, h:"Draft your layout",
   html:`<div class="grid2 fill"><div class="box">${steps(["Sketch your four sphere zones first.","Place reservoirs.","Add arrows in pencil, then label them.","Plan where the key and human impacts section go."])}</div><div class="box"><h3>Use your Lesson 11 group poster</h3><p>It's a great first draft. Improve it, don't copy it.</p></div></div>`,
   notes:"Planner evidence: poster draft plan. Conference with students needing help."},
  {mode:"move", timer:6, h:"Speed feedback",
   html:`<div class="grid2 fill"><div class="box">${steps(["Swap drafts with someone new.","2 minutes: tick the checklist on their draft and write one suggestion.","Rotate. Get feedback from 3 people."])}</div><div class="box" style="justify-content:center"><p class="lead">Feedback must be kind, specific and helpful.</p></div></div>`,
   notes:"Students keep the feedback for Lesson 20."},
  {mode:"check", h:"Exit: one change",
   html:`<div class="box fill" style="justify-content:center"><p class="lead">On your draft, write: <b>"One thing I will change is ___ because ___."</b></p><p class="small">Week 3 traffic light on a sticky note too.</p></div>`,
   notes:"Collect or photograph drafts."}
  ]}
);

/* ================= WEEK 4 ================= */
LESSONS.push(
{ n:13, title:"Photosynthesis and carbon uptake",
  li:"Understand how photosynthesis removes carbon dioxide from the atmosphere.",
  sc:["I can write the word equation for photosynthesis.","I can explain the role of photosynthesis in the carbon cycle."],
  prep:"Mini whiteboards. Optional: a pot plant and a bag of potting soil as props for the hook.",
  slides:[
  {mode:"talk", timer:3, h:"Where does a tree's mass come from?",
   html:`<div class="grid2 fill"><div class="box"><p class="lead">A huge river red gum can weigh many tonnes. Where did all that mass come from?</p><div class="grid2">${["The soil","Water","Sunlight","The air"].map((o,i)=>`<div class="box" style="align-items:center"><b class="spot" style="font-size:2.6cqw;padding:0">${i+1}. ${o}</b></div>`).join("")}</div><p class="small">Vote with fingers. Then argue with someone who chose differently.</p></div>
   <div class="box">${rv("The surprising answer","Mostly <b>the air</b>. The carbon and much of the oxygen in wood come from carbon dioxide. Hydrogen comes from water. Soil adds only small amounts of minerals.")}${rv("The evidence","In the 1600s Jan van Helmont grew a willow in a pot for 5 years. The tree gained about 74 kg. The soil lost only about 57 g.")}</div></div>`,
   notes:"A famous misconception: most students (and adults) say soil. Let the debate run before revealing."},
  {mode:"watch", h:"The story of photosynthesis",
   html:vid("eo5XndJaz-Y","The simple story of photosynthesis and food","TED-Ed",["What are the inputs (reactants) of photosynthesis?","What are the outputs (products)?","Where in the plant does it happen?"]),
   notes:"Students jot inputs and outputs as two lists."},
  {mode:"learn", h:"Photosynthesis: inputs and outputs",
   html:`<div class="grid3 fill"><div class="box tint atmo"><h3 class="ink">Inputs</h3><ul><li>Carbon dioxide (from the air, through stomata)</li><li>Water (from the soil, through roots)</li><li>Light energy (from the Sun)</li></ul></div><div class="box tint bio"><h3 class="ink">Where</h3><p>In <b>chloroplasts</b>, mostly in leaf cells. The green pigment <b>chlorophyll</b> captures light.</p></div><div class="box tint hydro"><h3 class="ink">Outputs</h3><ul><li>Glucose (a sugar that stores energy and carbon)</li><li>Oxygen (released into the air)</li></ul></div></div>`,
   notes:"Light is energy, not matter: it isn't a reactant atom. Link to energy flow versus matter cycling (Lesson 5)."},
  {mode:"whole", h:"Build the word equation", init:"slots",
   data:{extra:["nitrogen","soil"]},
   html:`<div class="box" style="align-items:center"><p class="eqn">${blank("carbon dioxide")} + ${blank("water")} <span style="white-space:nowrap">&rarr;</span> ${blank("glucose")} + ${blank("oxygen")}</p><p class="small">The arrow needs light energy, captured by chlorophyll.</p></div>${bankUI}<p class="small">Extension: 6CO&#8322; + 6H&#8322;O &rarr; C&#8326;H&#8321;&#8322;O&#8326; + 6O&#8322;. Count the atoms on each side. What do you notice?</p>`,
   notes:"Two distractor words are in the bank. Extension links to balancing equations from the chemistry unit."},
  {mode:"learn", h:"Photosynthesis in the carbon cycle",
   html:`<div class="grid2 fill"><div class="box"><h3>An interaction between spheres</h3><p><span class="atmo ink"><b>Atmosphere</b></span> &rarr; <span class="bio ink"><b>Biosphere</b></span></p><p>Photosynthesis moves carbon out of the air and into living things. It is the main way carbon enters the biosphere.</p></div><div class="box"><h3>Carbon stored in biomass</h3><p>Glucose is built into wood, leaves and roots. About half the dry mass of wood is carbon.</p><p>A big old tree can hold carbon for hundreds of years. Seagrass and mangroves also store carbon in the mud beneath them: "blue carbon".</p></div></div>`,
   notes:"Biomass = the mass of living material. Blue carbon returns in Lesson 24."},
  {mode:"move", timer:4, h:"Walk and talk",
   html:`<div class="box fill" style="justify-content:center">${steps(["Stand up and find someone from the other side of the room.","Partner A: explain how photosynthesis moves carbon (30 seconds).","Partner B: say one thing they missed. Swap roles.","Find a new partner. Repeat three times."])}</div>`,
   notes:"Repetition with feedback builds fluency before writing."},
  {mode:"write", timer:8, h:"Photosynthesis explanation",
   html:`<div class="grid2 fill"><div class="box"><p class="lead">Explain how photosynthesis removes carbon dioxide from the atmosphere and stores carbon in the biosphere.</p><p>Include the word equation and one example.</p></div><div class="box"><h3>Use</h3><p>Claim, Process, Example, Link (from Lesson 11).</p><h3>Word bank</h3><p>chloroplast &middot; chlorophyll &middot; glucose &middot; biomass &middot; stomata &middot; atmosphere &middot; biosphere &middot; interaction</p></div></div>`,
   notes:"Planner evidence: photosynthesis explanation."},
  {mode:"check", h:"Exit: hinge question",
   html:`<div class="box"><p><b>A plant is sealed in a clear jar and left in bright light for a day. What happens to the CO&#8322; in the jar?</b></p><ol><li>It increases</li><li>It decreases</li><li>It stays the same</li><li>It turns into nitrogen</li></ol></div>${rv("Answer","2. It decreases. In bright light the plant photosynthesises faster than it respires, so it takes in more CO&#8322; than it releases.")}`,
   notes:"Sets up next lesson: what happens in the dark?"}
  ]},

{ n:14, title:"Respiration and decomposition",
  li:"Understand how carbon returns to the atmosphere and soil.",
  sc:["I can explain respiration and decomposition in the carbon cycle.","I can compare photosynthesis and respiration."],
  prep:"Optional: a sealed bag with mouldy bread or fruit as a prop.",
  slides:[
  {mode:"check", h:"Retrieval: the jar in the dark",
   html:`<div class="grid2 fill"><div class="box" style="justify-content:center"><p class="lead">Last lesson the jar was in bright light. Now we put it in a dark cupboard overnight. What happens to the CO&#8322;?</p></div><div class="box">${rv("Answer","It increases. With no light, there's no photosynthesis, but the plant still <b>respires</b>, releasing CO&#8322;. Plants respire all the time, day and night.")}</div></div>`,
   notes:"Tackles the misconception that plants only photosynthesise and animals only respire."},
  {mode:"learn", h:"Respiration",
   html:`<p class="def"><b>Cellular respiration</b> releases the energy stored in glucose so cells can use it. It happens in <b>every</b> living cell: plants, animals, fungi and bacteria.</p>
   <div class="box" style="align-items:center"><p class="eqn">${blank("glucose")} + ${blank("oxygen")} &rarr; ${blank("carbon dioxide")} + ${blank("water")} (+ energy)</p></div>${bankUI}`,
   init:"slots",
   notes:"Students should spot it's the reverse of photosynthesis."},
  {mode:"talk", timer:3, h:"Spot the pattern",
   html:`<div class="grid2 fill"><div class="box"><h3>Photosynthesis</h3><p>carbon dioxide + water &rarr; glucose + oxygen</p><h3>Respiration</h3><p>glucose + oxygen &rarr; carbon dioxide + water</p></div><div class="box"><p class="lead">What do you notice? Why does that matter for the carbon cycle?</p>${rv("Big idea","They are mirror images. Photosynthesis takes carbon out of the air; respiration puts it back. Together they keep carbon cycling between the atmosphere and biosphere.")}</div></div>`,
   notes:"The mirror image is the key insight."},
  {mode:"group", h:"Photosynthesis, respiration, or both?", init:"sort",
   data:{zones:[["p","Photosynthesis","bio"],["b","Both","hydro"],["r","Respiration","atmo"]],
     items:[["Uses carbon dioxide","p"],["Releases carbon dioxide","r"],["Needs light","p"],["Happens in all living cells","r"],["Happens in plants","b"],["Involves glucose","b"],["Releases energy for the cell","r"],["Stores energy in glucose","p"],["Produces oxygen","p"],["Uses oxygen","r"],["Part of the carbon cycle","b"]]},
   html:`<p class="small">A Venn diagram on the board. Pairs decide, then a volunteer places each card.</p>${sortUI}`,
   notes:"'Happens in plants' goes in Both: a common trap."},
  {mode:"watch", h:"The dirt on decomposers",
   html:vid("uB61rfeeAsM","The Dirt on Decomposers","Crash Course Kids",["What do decomposers eat?","Name two decomposers.","What would happen to Earth without decomposers?"]),
   notes:"Short and simple. Use the last question for a quick discussion."},
  {mode:"learn", h:"Decomposition",
   html:`<div class="grid2 fill"><div class="box"><h3>Who does it?</h3><p><b>Decomposers</b> (fungi and bacteria) break down dead matter and waste. <b>Detritivores</b> (worms, slaters, millipedes) chew it into smaller pieces first.</p></div><div class="box"><h3>Where does the carbon go?</h3><p>Decomposers <b>respire</b>, releasing CO&#8322; to the air. Some carbon stays in the soil as dark <b>humus</b>.</p></div><div class="box"><h3>What speeds it up?</h3><p>Warmth, moisture and oxygen.</p></div><div class="box"><h3>What slows it down?</h3><p>Cold, dryness, or no oxygen (waterlogged swamps). Slow decomposition in swamps is how coal began forming millions of years ago.</p></div></div>`,
   notes:"The swamp point bridges to fossil fuels."},
  {mode:"whole", h:"Would it rot?", init:"vote",
   data:[["An apple core in a compost bin","Yes, fast. Warm, moist, full of decomposers and oxygen."],["A plastic bag in the ground","Not really. Decomposers can't digest most plastics, so it lasts hundreds of years."],["A log in a dry desert","Slowly. Too dry for many decomposers."],["Leaves on a warm, wet rainforest floor","Very fast. Perfect conditions."],["A woolly mammoth frozen in permafrost","Hardly at all. Too cold. Mammoths have been found with fur still on."],["Plants in a waterlogged peat bog","Very slowly. No oxygen. Peat can become coal over millions of years."]],
   html:`<p>Fast, slow, or not at all? Show with your hand: up high, middle, down low.</p>${voteUI()}`,
   notes:"Links decomposition rate to conditions."},
  {mode:"write", timer:8, h:"Comparison table",
   html:`<div class="tablewrap"><table class="ctable"><thead><tr><th></th><th>Photosynthesis</th><th>Respiration</th><th>Decomposition</th></tr></thead><tbody>${["Which organisms?","Inputs","Outputs","Effect on CO&#8322; in the air","Spheres connected"].map(r=>`<tr><th>${r}</th><td></td><td></td><td></td></tr>`).join("")}</tbody></table></div><p class="small">Copy and complete. Planner evidence for this lesson.</p>`,
   notes:"Planner evidence: comparison table."},
  {mode:"check", h:"Exit: fist to five",
   html:`<div class="box fill" style="justify-content:center"><ul><li>I can explain respiration and decomposition in the carbon cycle.</li><li>I can compare photosynthesis and respiration.</li></ul><p class="small">Next lesson: we plan a real investigation into photosynthesis.</p></div>`,
   notes:""}
  ]},

{ n:15, title:"Planning a photosynthesis investigation",
  li:"Plan a scientific investigation about photosynthesis.",
  sc:["I can identify the independent, dependent and controlled variables.","I can write a method and identify safety requirements."],
  prep:"Planning sheet. If possible, a demo set: spinach leaves, straw or hole punch, 10 mL syringe, bicarbonate solution with a drop of detergent, cup, lamp.",
  slides:[
  {mode:"watch", h:"Floating leaf disks",
   html:vid("XV9FOWleErA","Photosynthesis in Leaf Disks Experiment","Craig Kohn",["Why do the leaf disks sink at the start?","Why do they float later?","What is the bicarbonate solution for?"]),
   notes:"If you have the gear, do a live demo instead or as well."},
  {mode:"learn", h:"How the leaf disk method works",
   html:`<div class="grid3 fill"><div class="box"><h3>1. Sink</h3><p>A syringe pulls the air out of small leaf disks and fills the spaces with bicarbonate solution. The disks sink.</p></div><div class="box"><h3>2. Photosynthesise</h3><p>Bicarbonate provides CO&#8322;. Under a lamp the disks photosynthesise and make oxygen.</p></div><div class="box"><h3>3. Float</h3><p>Oxygen bubbles build up inside the disks and they float. <b>Faster floating = faster photosynthesis.</b></p></div></div>`,
   notes:"The floating rate is an indirect measure: the class should notice that."},
  {mode:"learn", h:"Our investigation question",
   html:`<p class="def">How does <b>light intensity</b> (distance from the lamp) affect the <b>rate of photosynthesis</b>?</p><div class="grid3"><div class="box tint atmo"><h3 class="ink">Independent variable</h3><p>What we change on purpose.</p></div><div class="box tint hydro"><h3 class="ink">Dependent variable</h3><p>What we measure.</p></div><div class="box tint geo"><h3 class="ink">Controlled variables</h3><p>What we keep the same so it's a fair test.</p></div></div>`,
   notes:"Other possible IVs from the planner: bicarbonate concentration, colour filter. Groups could each test a different IV if your class is confident."},
  {mode:"group", h:"Sort the variables", init:"sort",
   data:{zones:[["iv","Independent","atmo"],["dv","Dependent","hydro"],["cv","Controlled","geo"]],
     items:[["Distance from the lamp","iv"],["Time for 5 disks to float","dv"],["Type of leaf","cv"],["Size of leaf disks","cv"],["Bicarbonate concentration","cv"],["Number of disks per cup","cv"],["Water temperature","cv"],["Type of lamp","cv"],["Volume of solution","cv"]]},
   html:sortUI,
   notes:"Ask why water temperature matters: lamps heat water, and temperature affects photosynthesis."},
  {mode:"group", h:"Put the method in order", init:"order",
   data:[["Make bicarbonate solution with a drop of detergent"],["Punch 10 disks from a spinach leaf"],["Put disks and solution in a syringe and remove the air until disks sink"],["Pour disks and solution into a cup"],["Place the cup at the set distance from the lamp"],["Turn on the lamp and start the timer"],["Count floating disks every minute"],["Record the time when 5 disks float"],["Repeat for each distance, 3 trials each"]],
   html:orderUI("first","last"),
   notes:"Groups use paper strips first, then confirm on the board."},
  {mode:"talk", timer:4, h:"Risk assessment",
   html:`<div class="grid4">${[["Hot lamps","Burns. Don't touch the bulb; let it cool before packing up."],["Water near power","Electric shock. Keep cups away from power points and cords."],["Glassware","Cuts. Use plastic cups where possible; report breakages."],["Syringes","Use only for the solution. Never point at people. No needles."]].map(c=>rv(c[0],c[1],"Name the risk and control")).join("")}</div>`,
   notes:"Students write the risk and control in the planning sheet."},
  {mode:"write", timer:12, h:"Complete your planning sheet",
   html:`<div class="grid2 fill"><div class="box"><h3>Planning sheet</h3><ol><li>Aim</li><li>Hypothesis: <i>If... then... because...</i></li><li>Variables (IV, DV, 3+ CVs)</li><li>Equipment list</li><li>Method (numbered steps)</li><li>Risk assessment</li><li>Results table (blank)</li></ol></div><div class="box"><h3>Hypothesis example</h3><p>If the lamp is closer to the leaf disks, then they will float faster, because more light energy increases the rate of photosynthesis, producing more oxygen.</p></div></div>`,
   notes:"Planner evidence: investigation planning sheet."},
  {mode:"check", h:"Exit: hypothesis swap",
   html:`<div class="box fill" style="justify-content:center"><p class="lead">Swap with a partner. Does their hypothesis have an <b>if</b>, a <b>then</b> and a <b>because</b> that uses science? Tick or suggest a fix.</p></div>`,
   notes:"Check planning sheets before Lesson 16."}
  ]},

{ n:16, title:"Conducting the practical",
  li:"Conduct a safe investigation and collect reliable data.",
  sc:["I can follow a method safely as part of a team.","I can record data accurately during a practical."],
  prep:"Per group: spinach leaves, straw or hole punch, 10 mL syringe, bicarbonate solution (about 0.2%) with a drop of detergent, clear cups, lamp, ruler, timer. Check lamps and cords.",
  slides:[
  {mode:"learn", h:"Team roles",
   html:`<div class="grid4 fill">${[["Manager","Keeps the team on the method and safe."],["Materials","Collects and returns equipment."],["Timekeeper","Runs the timer, calls each minute."],["Recorder","Writes counts in the results table."]].map(c=>`<div class="box"><h3>${c[0]}</h3><p>${c[1]}</p></div>`).join("")}</div><p class="small">Everyone counts floating disks. Swap roles between distances.</p>`,
   notes:"Assigned roles reduce chaos."},
  {mode:"check", h:"Safety check before you start", init:"vote",
   data:[["Your lamp has been on for 20 minutes. Can you move it by the bulb?","No. Move it by the base. Bulbs get very hot."],["You spill solution near a power board. What do you do?","Turn off and unplug at the wall if safe, tell the teacher, wipe up."],["Can the syringe be used to squirt your friend?","No. It's lab equipment."]],
   html:voteUI(),
   notes:"Quick safety briefing."},
  {mode:"whole", h:"Your results table",
   html:`<div class="tablewrap"><table class="ctable"><thead><tr><th>Distance from lamp (cm)</th><th>Trial 1: time for 5 disks to float (min)</th><th>Trial 2 (min)</th><th>Trial 3 (min)</th><th>Average (min)</th></tr></thead><tbody>${[10,20,30,40,50].map(d=>`<tr><th>${d}</th><td></td><td></td><td></td><td></td></tr>`).join("")}</tbody></table></div><p class="small">Units go in the headings, not in every cell. Record observations too: bubbles, disks that never sank, anything odd.</p>`,
   notes:"If time is short, split distances between groups and pool class data."},
  {mode:"prac", timer:35, h:"Run the investigation",
   html:`<div class="grid2 fill"><div class="box">${steps(["Set up at your first distance.","Infiltrate your disks until they sink.","Lamp on, timer on. Count floaters every minute.","Record the time when 5 disks float, then move to the next distance."])}</div><div class="box"><h3>Checkpoints</h3><ul><li>10 min: first distance done?</li><li>20 min: show your table to the teacher.</li><li>30 min: final distance running.</li></ul></div></div>`,
   notes:"Circulate. Common issue: disks won't sink. Fix: more pulls on the syringe, fresh solution, a drop more detergent."},
  {mode:"move", timer:6, h:"Pack up and pool results",
   html:`<div class="grid2 fill"><div class="box">${steps(["Lamps off and cooling.","Rinse and return equipment.","Recorder writes your averages on the class board.","Wipe benches."])}</div><div class="box" style="justify-content:center"><p class="lead">Class data lets us check if results are reliable across groups.</p></div></div>`,
   notes:"Photograph the class data board for Lesson 17."},
  {mode:"talk", timer:4, h:"Notice and wonder",
   html:`<div class="grid2 fill"><div class="box tint bio"><h3 class="ink">I notice...</h3><p class="small" style="color:var(--ink)">A pattern, a surprise, a result that doesn't fit.</p></div><div class="box tint atmo"><h3 class="ink">I wonder...</h3><p class="small" style="color:var(--ink)">A question your data raises.</p></div></div>`,
   notes:"Collect a few wonders for the evaluation lesson."},
  {mode:"check", h:"Exit",
   html:`<div class="box fill" style="justify-content:center"><p class="lead">One sentence: <b>Did your results support your hypothesis? What makes you say that?</b></p><p class="small">Week 4 traffic light.</p></div>`,
   notes:""}
  ]}
);

/* ================= WEEK 5 ================= */
LESSONS.push(
{ n:17, title:"Processing and analysing data",
  li:"Represent and interpret investigation data.",
  sc:["I can draw a line graph that follows the graphing rules.","I can describe a trend and identify an anomaly."],
  prep:"Graph paper or a spreadsheet. Photo of the class data board from Lesson 16.",
  slides:[
  {mode:"check", h:"Retrieval: variables",
   html:`<div class="grid3">${[["What was our independent variable?","Distance from the lamp (light intensity)."],["What was our dependent variable?","Time for 5 disks to float."],["Why did we do 3 trials?","To check our results are reliable (repeatable) and to reduce the effect of random errors."]].map(c=>rv(c[0],c[1])).join("")}</div>`,
   notes:""},
  {mode:"learn", h:"Graphing rules: TAILS",
   html:`<div class="grid2 fill"><div class="box"><ul><li><b>T</b>itle: what was investigated</li><li><b>A</b>xes: independent variable on the x-axis, dependent on the y-axis</li><li><b>I</b>ntervals: evenly spaced numbers</li><li><b>L</b>abels: quantity and unit on each axis</li><li><b>S</b>cale: uses most of the grid</li></ul></div><div class="box"><h3>Which type of graph?</h3><p>Both variables are numbers that change continuously, so use a <b>line graph</b> (or a scatter graph with a line of best fit).</p><p class="small">Bar graphs are for categories, like leaf type.</p></div></div>`,
   notes:"Revisit any graphing conventions your faculty uses."},
  {mode:"whole", h:"Practice data: find the pattern", init:"leaf cells",
   html:`<div class="grid2 fill" style="grid-template-columns:1fr 1.2fr"><div style="display:flex;flex-direction:column;gap:.8cqw"><p class="small"><b>Example data (made up for practice).</b></p><div class="tablewrap" id="leafTbl"><table class="ctable"><thead><tr><th>Distance (cm)</th><th>T1</th><th>T2</th><th>T3</th><th>Average (min)</th></tr></thead><tbody>${LEAF_DATA.map(d=>`<tr><th>${d.cm}</th>${d.t.map(t=>`<td${d.cm===40&&t===22?' style="color:var(--bad);font-weight:700"':''}>${t}</td>`).join("")}<td class="rcell">${(d.cm===40?(14+15)/2:d.t.reduce((a,b)=>a+b,0)/3).toFixed(1)}</td></tr>`).join("")}</tbody></table></div><div class="row"><button class="btn primary" id="leafAvg">Show averages and line</button></div><p class="small">The 40 cm average leaves out the 22: why?</p></div><div class="chartbox box" id="leafChart"></div></div>`,
   notes:"Students calculate averages on whiteboards before you reveal. Discuss excluding the anomaly with a reason."},
  {mode:"talk", timer:4, h:"Notice and wonder: the practice data",
   html:`<div class="grid3">${[["What is the trend?","As the distance from the lamp increases, the time for disks to float increases."],["What does that mean for photosynthesis?","Further from the lamp = less light = slower photosynthesis = less oxygen made, so disks float later."],["Which result is an anomaly?","Trial 2 at 40 cm (22 minutes). It doesn't fit the pattern. Maybe disks weren't fully infiltrated, or the lamp moved."]].map(c=>rv(c[0],c[1],"Discuss, then click")).join("")}</div>`,
   notes:"An anomaly is a result that doesn't fit the pattern. We exclude it only with a reason, and say so."},
  {mode:"learn", h:"Describing a trend",
   html:`<div class="box"><h3>Sentence frame</h3><p class="def">As the <b>[independent variable]</b> increased, the <b>[dependent variable]</b> <b>[increased/decreased]</b>. This shows that...</p></div><div class="box"><h3>Example</h3><p>As the distance from the lamp increased from 10 cm to 50 cm, the average time for 5 disks to float increased from 6.3 to 19.0 minutes. This shows that the rate of photosynthesis decreased as light intensity decreased.</p></div>`,
   notes:"Quote data in the description: first and last values make it specific."},
  {mode:"write", timer:15, h:"Graph your own data",
   html:`<div class="grid2 fill"><div class="box">${steps(["Calculate averages for your group's (or the class's) data.","Draw a line graph using TAILS.","Circle any anomaly.","Write a trend sentence using the frame."])}</div><div class="box"><h3>Faster finishers</h3><p>Plot the class data on the same axes in a different colour. Do the groups agree?</p></div></div>`,
   notes:"Planner evidence: graph. A spreadsheet is fine if students know how."},
  {mode:"group", timer:6, h:"Link it back to carbon",
   html:`<div class="grid3">${[["Where did the oxygen in the bubbles come from?","From photosynthesis. (Strictly, from the water molecules, a fun extension fact.)"],["Where did the carbon go?","Into glucose inside the leaf: carbon moved from the hydrosphere (dissolved bicarbonate) to the biosphere."],["What would a forest in bright sun do to CO&#8322; in the air?","Take in more CO&#8322;, because photosynthesis runs faster in more light."]].map(c=>rv(c[0],c[1],"Discuss, then click")).join("")}</div>`,
   notes:"Analysis questions: link results to the carbon cycle."},
  {mode:"check", h:"Exit",
   html:`<div class="box fill" style="justify-content:center"><p class="lead">Write your trend sentence on a sticky note and stick it on the board, sorted by: <b>uses data</b> / <b>no data yet</b>.</p></div>`,
   notes:""}
  ]},

{ n:18, title:"Validity, reliability and errors",
  li:"Evaluate a scientific investigation.",
  sc:["I can explain validity, reliability, accuracy and precision.","I can identify limitations and suggest improvements."],
  prep:"Students' results and graphs from Lessons 16 and 17.",
  slides:[
  {mode:"talk", timer:4, h:"Four dartboards",
   html:`<div style="max-width:62%;margin-inline:auto;width:100%">${dartSVG()}</div><p class="lead">The bullseye is the true value. With your partner: which board is <b>accurate</b>? Which is <b>precise</b>? Which is both?</p><div class="grid4">${[["A","Accurate and precise"],["B","Precise, not accurate"],["C","Neither: scattered and off-centre"],["D","Neither: scattered widely"]].map(c=>rv("Board "+c[0],c[1])).join("")}</div>`,
   notes:"Board C's average may land near the centre; good discussion on why averaging helps random error."},
  {mode:"learn", h:"Four words scientists use carefully",
   html:`<div class="grid2 fill">${[["Validity","Does the experiment test what it claims, fairly? Only the IV changes; everything else is controlled."],["Reliability","Do repeat trials give similar results? Improve it with more trials and averages."],["Accuracy","How close a result is to the true value."],["Precision","How close repeated results are to each other."]].map(c=>`<div class="box"><h3>${c[0]}</h3><p>${c[1]}</p></div>`).join("")}</div>
   <p class="small"><b>Random errors</b> change results unpredictably (counting disks at slightly different moments). <b>Systematic errors</b> push every result the same way (a stopwatch that starts late).</p>`,
   notes:"Students add these to the glossary."},
  {mode:"group", timer:6, h:"Spot the flaw",
   html:`<div class="grid3">${[["Group 1 used spinach for 10 cm and lettuce for 50 cm.","Validity: leaf type changed as well as distance. Use the same leaf for all trials."],["Group 2 did only one trial per distance.","Reliability: no way to check repeatability. Do 3 or more trials."],["Group 3's lamp heated the water at 10 cm.","Validity: temperature became a second variable. Use a water bath or LED lamp."],["Group 4 used old bicarbonate solution for the last trials.","Validity: CO&#8322; supply changed. Make fresh solution."],["Group 5 started timing before turning on the lamp.","Systematic error: every time is too long by the same amount."],["Group 6 rounded all times to the nearest 5 minutes.","Precision: results too rough to see differences. Record to the nearest minute or better."]].map(c=>rv(c[0],c[1],"What's the problem? Fix?")).join("")}</div>`,
   notes:"Groups take one card each, then share."},
  {mode:"whole", h:"Validity or reliability?", init:"sort",
   data:{zones:[["v","Improves validity","atmo"],["r","Improves reliability","hydro"]],
     items:[["Keep the water temperature the same","v"],["Do 3 trials at each distance","r"],["Use the same type of leaf","v"],["Calculate averages","r"],["Use fresh bicarbonate solution each time","v"],["Compare with other groups' data","r"],["Measure light with a light meter instead of distance","v"]]},
   html:sortUI,
   notes:"The light meter improves validity: it measures light intensity directly rather than inferring it from distance."},
  {mode:"write", timer:10, h:"Evaluate your investigation",
   html:`<div class="grid2 fill"><div class="box"><h3>Evaluation paragraph</h3><ol><li>One <b>limitation</b> and how it affected the results.</li><li>How <b>reliable</b> your results were (use your trials).</li><li>One <b>improvement</b> and why it helps.</li><li>A conclusion: was the hypothesis supported?</li></ol></div><div class="box"><h3>Sentence starters</h3><ul><li>One limitation was... which may have caused...</li><li>Our results were (fairly / not very) reliable because...</li><li>To improve validity, we could...</li></ul></div></div>`,
   notes:"Planner evidence: evaluation paragraph. This begins the summative investigation write-up."},
  {mode:"talk", timer:4, h:"Plan the write-up",
   html:`<div class="box fill" style="justify-content:center"><p class="lead">Your investigation report needs: aim, hypothesis, variables, method, results table, graph, analysis, evaluation, conclusion linking to the carbon cycle.</p><p>Tell your partner which section you'll find hardest and one thing that will help.</p></div>`,
   notes:"Set the due date for the report."},
  {mode:"check", h:"Exit: one word each",
   html:`<div class="grid4 fill">${["validity","reliability","accuracy","precision"].map(w=>`<div class="box" style="align-items:center;justify-content:center"><b style="font-family:var(--f-display);font-size:2.2cqw">${w}</b><p class="small">Write a 5-word definition</p></div>`).join("")}</div>`,
   notes:""}
  ]},

{ n:19, title:"Human impacts on the carbon cycle",
  li:"Understand how human activity changes natural carbon flows.",
  sc:["I can explain how combustion and land clearing affect the carbon cycle.","I can compare a natural and a human-influenced carbon cycle."],
  prep:"A3 placemat sheets (four sections and a centre) per group.",
  slides:[
  {mode:"watch", h:"A year of CO&#8322; from space",
   html:vid("x1SgmFa0r04","A Year in the Life of Earth's CO2","NASA Goddard",["Where on Earth does most CO&#8322; come from?","What happens to CO&#8322; in the northern summer? Why?","How does the CO&#8322; move around the planet?"]),
   notes:"Stunning visual. The northern summer dip is photosynthesis by northern forests."},
  {mode:"learn", h:"How humans change the carbon cycle",
   html:`<div class="grid2 fill">${[["Burning fossil fuels","Coal, oil and gas move carbon from the slow cycle (millions of years) into the air in seconds."],["Clearing land","Removing forests and native vegetation means less photosynthesis, and burning or rotting the wood releases CO&#8322;."],["Making cement","Heating limestone releases CO&#8322; directly, plus the fuel burned to heat it."],["Agriculture","Cattle and sheep release methane. Ploughing releases carbon stored in soil."]].map(c=>`<div class="box"><h3>${c[0]}</h3><p>${c[1]}</p></div>`).join("")}</div>`,
   notes:"Emphasise the slow-to-fast idea from Lesson 9."},
  {mode:"group", timer:8, h:"Placemat",
   html:`<div class="grid2 fill"><div class="box">${steps(["Groups of 4 around an A3 placemat. Each person takes one impact.","In your section, write: which reservoir loses carbon, which gains it, and which spheres.","Rotate the placemat. Add to each section.","In the centre, agree on one sentence true for all four impacts."])}</div><div class="box" style="justify-content:center"><p class="lead">Centre sentence hint: where is the carbon ending up?</p></div></div>`,
   notes:"Centre consensus: all four move carbon into the atmosphere faster than natural processes remove it."},
  {mode:"learn", h:"Natural balance versus today",
   html:`<div class="grid2 fill"><div class="box tint bio"><h3 class="ink">Natural carbon cycle</h3><p>Over thousands of years, carbon taken in (photosynthesis, oceans) roughly balanced carbon released (respiration, decomposition, volcanoes). CO&#8322; stayed close to <b>280 ppm</b> before industry.</p></div><div class="box tint geo"><h3 class="ink">Human-influenced cycle</h3><p>We add carbon faster than plants and oceans can take it up. Mauna Loa measured about <b>317 ppm</b> in 1960 and about <b>421 ppm</b> in 2023.</p></div></div><p class="small">ppm = parts per million: CO&#8322; molecules per million molecules of air. Data: NOAA Global Monitoring Laboratory.</p>`,
   notes:"The ocean and land absorb about half of what we emit; the rest builds up in the air."},
  {mode:"whole", h:"Natural or human?", init:"sort",
   data:{zones:[["n","Natural","bio"],["h","Human",""],["b","Both","hydro"]],
     items:[["Volcanic eruption","n"],["Burning petrol","h"],["Making cement","h"],["Bushfire","b"],["Respiration","n"],["Clearing scrub for housing","h"],["Methane from cattle","h"],["Decomposition","n"],["Methane from wetlands","n"]],
     note:"Bushfires start naturally (lightning) and from people."},
   html:sortUI,
   notes:"Bushfire goes in both. Cattle methane is human-influenced because we farm them."},
  {mode:"write", timer:10, h:"Annotate the comparison",
   html:`<div class="grid2 fill"><div class="box"><p class="lead">Draw two simple carbon cycles side by side: <b>natural</b> and <b>human-influenced</b>.</p><p>On the human one, add thicker arrows for combustion and land clearing. Annotate three differences.</p></div><div class="box"><h3>Must show</h3><ul><li>Fossil fuels &rarr; atmosphere</li><li>Fewer trees, less photosynthesis</li><li>Bigger atmosphere reservoir</li></ul></div></div>`,
   notes:"Planner evidence: annotated comparison diagram."},
  {mode:"talk", timer:4, h:"What can be done?",
   html:`<div class="grid2 fill"><div class="box"><p class="lead">Think, pair, share: name one way to <b>reduce carbon going in</b> and one way to <b>increase carbon coming out</b> of the atmosphere.</p></div><div class="box">${rv("Some answers","Going in: renewable energy, electric transport, less land clearing. Coming out: plant trees, restore seagrass and wetlands, look after soil. South Australia now gets most of its electricity from wind and solar.")}</div></div>`,
   notes:"Keep the tone hopeful and practical."},
  {mode:"check", h:"Exit",
   html:`<div class="box fill" style="justify-content:center"><p class="lead">In one sentence: <b>why does burning fossil fuels upset the balance of the carbon cycle?</b></p></div>`,
   notes:"Look for the slow-to-fast idea."}
  ]},

{ n:20, title:"Finishing the carbon cycle model",
  li:"Communicate understanding of the carbon cycle clearly.",
  sc:["I can produce an accurate scientific representation of the carbon cycle.","I can give and use peer feedback."],
  prep:"Drafts from Lesson 12, A3 card, coloured pencils, glue, modelling materials as needed. Sticky notes in two colours.",
  slides:[
  {mode:"learn", h:"Today: build, check, improve",
   html:`<div class="grid3 fill"><div class="box"><h3>30 minutes</h3><p>Build your final model from your draft.</p></div><div class="box"><h3>10 minutes</h3><p>Gallery walk peer review.</p></div><div class="box"><h3>5 minutes</h3><p>Make improvements.</p></div></div>
